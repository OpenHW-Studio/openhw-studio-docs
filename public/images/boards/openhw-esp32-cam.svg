<svg width="250" height="350" viewBox="0 0 250 350" style="font-family: sans-serif; user-select: none;" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Black PCB -->
  <rect x="40" y="30" width="170" height="290" rx="10" fill="#222" />
  
  <!-- Wi-Fi Antenna Trace Area -->
  <path d="M 40 30 L 210 30 L 210 60 L 40 60 Z" fill="#1a1a1a" />
  
  <!-- MicroSD Card Slot -->
  <rect x="80" y="30" width="90" height="50" fill="#ccc" stroke="#999" />
  <polygon points="170,30 170,80 150,80 150,50 80,50 80,30" fill="#999" />
  
  <!-- Camera Module Base -->
  <rect x="90" y="100" width="70" height="70" fill="#111" />
  
  <!-- Camera Ribbon Cable -->
  <rect x="105" y="170" width="40" height="50" fill="#b4833c" />
  <rect x="95" y="220" width="60" height="15" fill="#e5e5e5" />
  
  <!-- Camera Lens Assembly -->
  <circle cx="125" cy="135" r="25" fill="#333" stroke="#555" stroke-width="2" />
  <circle cx="125" cy="135" r="15" fill="#111" />
  <circle cx="125" cy="135" r="5" fill="#1a0000" />
  <circle cx="127" cy="133" r="2" fill="#444" />
  
  <!-- Flash LED (Pin 4) -->
  <rect x="175" y="255" width="20" height="20" fill="#fff" stroke="#ffd700" />
  <circle cx="185" cy="265" r="8" fill="#fef08a" />
  <text x="175" y="285" fill="#fff" font-size="8" font-weight="bold">-   +</text>
  
  <!-- Small Status LED -->
  <rect x="65" y="255" width="6" height="4" fill="#111" />
  <rect x="73" y="255" width="10" height="4" fill="#ef4444" />
  <text x="65" y="250" fill="#fff" font-size="6" font-weight="bold">LED1</text>
  <rect x="65" y="260" width="18" height="12" fill="none" stroke="#fff" stroke-width="1" />
  <circle cx="74" cy="266" r="2" fill="#fff" />

  <!-- Back ESP32 Chip (Visible parts from back side theoretically, or shield trace) -->
  <rect x="100" y="250" width="50" height="15" rx="2" fill="#111" />
  <rect x="105" y="253" width="5" height="9" fill="#9ca3af" />
  <rect x="115" y="253" width="5" height="9" fill="#9ca3af" />
  <rect x="125" y="253" width="5" height="9" fill="#9ca3af" />
  <rect x="135" y="253" width="5" height="9" fill="#9ca3af" />

  <!-- Logo Text -->
  <text x="125" y="300" fill="#e5e5e5" font-size="20" font-weight="bold" text-anchor="middle">ESP32-CAM</text>

  <!-- Headers -->
  <defs>
    <rect id="pin" width="12" height="10" rx="2" fill="#eab308" />
    <circle id="hole" cx="6" cy="5" r="3" fill="#f8fafc" />
    <g id="header-pin">
      <use href="#pin" />
      <use href="#hole" />
    </g>
  </defs>

  <!-- Left Header (8 pins) -->
  <g transform="translate(50, 70)">
    <use href="#header-pin" x="0" y="0" />   <text x="20" y="8" fill="#fff" font-size="10" font-weight="bold">5V</text>
    <use href="#header-pin" x="0" y="20" />  <text x="20" y="28" fill="#fff" font-size="10" font-weight="bold">GND</text>
    <use href="#header-pin" x="0" y="40" />  <text x="20" y="48" fill="#fff" font-size="10" font-weight="bold">12</text>
    <use href="#header-pin" x="0" y="60" />  <text x="20" y="68" fill="#fff" font-size="10" font-weight="bold">13</text>
    <use href="#header-pin" x="0" y="80" />  <text x="20" y="88" fill="#fff" font-size="10" font-weight="bold">15</text>
    <use href="#header-pin" x="0" y="100" /> <text x="20" y="108" fill="#fff" font-size="10" font-weight="bold">14</text>
    <use href="#header-pin" x="0" y="120" /> <text x="20" y="128" fill="#fff" font-size="10" font-weight="bold">2</text>
    <use href="#header-pin" x="0" y="140" /> <text x="20" y="148" fill="#fff" font-size="10" font-weight="bold">4</text>
  </g>

  <!-- Right Header (8 pins) -->
  <g transform="translate(188, 70)">
    <use href="#header-pin" x="0" y="0" />   <text x="-5" y="8" fill="#fff" font-size="10" font-weight="bold" text-anchor="end">3V3</text>
    <use href="#header-pin" x="0" y="20" />  <text x="-5" y="28" fill="#fff" font-size="10" font-weight="bold" text-anchor="end">16</text>
    <use href="#header-pin" x="0" y="40" />  <text x="-5" y="48" fill="#fff" font-size="10" font-weight="bold" text-anchor="end">0</text>
    <use href="#header-pin" x="0" y="60" />  <text x="-5" y="68" fill="#fff" font-size="10" font-weight="bold" text-anchor="end">GND</text>
    <use href="#header-pin" x="0" y="80" />  <text x="-5" y="88" fill="#fff" font-size="10" font-weight="bold" text-anchor="end">VCC</text>
    <use href="#header-pin" x="0" y="100" /> <text x="-5" y="108" fill="#fff" font-size="10" font-weight="bold" text-anchor="end">RX</text>
    <use href="#header-pin" x="0" y="120" /> <text x="-5" y="128" fill="#fff" font-size="10" font-weight="bold" text-anchor="end">TX</text>
    <use href="#header-pin" x="0" y="140" /> <text x="-5" y="148" fill="#fff" font-size="10" font-weight="bold" text-anchor="end">GND</text>
  </g>
</svg>
