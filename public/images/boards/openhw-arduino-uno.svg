<svg width="350" height="250" viewBox="0 0 350 250" style="font-family: sans-serif; user-select: none;" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Blue PCB -->
  <path d="M 50 30 L 320 30 L 320 100 L 340 120 L 340 230 L 50 230 Z" fill="#296c9c" />

  <!-- USB Type-B Port -->
  <rect x="25" y="45" width="40" height="30" fill="#d4d4d4" stroke="#a3a3a3" />
  <rect x="35" y="50" width="20" height="20" fill="#f5f5f5" />
  
  <!-- DC Barrel Jack -->
  <rect x="25" y="170" width="40" height="30" fill="#111" />
  
  <!-- Reset Button -->
  <rect x="60" y="35" width="12" height="12" fill="#fff" />
  <circle cx="66" cy="41" r="3" fill="#ef4444" />
  
  <!-- Main Chip (ATmega328P DIP) -->
  <rect x="140" y="130" width="160" height="25" rx="2" fill="#222" />
  <!-- Indent on chip -->
  <circle cx="145" cy="142.5" r="3" fill="#111" />
  <!-- Chip pins -->
  <g fill="#9ca3af">
    <!-- Top row -->
    <rect x="145" y="127" width="2" height="3" /><rect x="155" y="127" width="2" height="3" /><rect x="165" y="127" width="2" height="3" /><rect x="175" y="127" width="2" height="3" /><rect x="185" y="127" width="2" height="3" /><rect x="195" y="127" width="2" height="3" /><rect x="205" y="127" width="2" height="3" /><rect x="215" y="127" width="2" height="3" /><rect x="225" y="127" width="2" height="3" /><rect x="235" y="127" width="2" height="3" /><rect x="245" y="127" width="2" height="3" /><rect x="255" y="127" width="2" height="3" /><rect x="265" y="127" width="2" height="3" /><rect x="275" y="127" width="2" height="3" />
    <!-- Bottom row -->
    <rect x="145" y="155" width="2" height="3" /><rect x="155" y="155" width="2" height="3" /><rect x="165" y="155" width="2" height="3" /><rect x="175" y="155" width="2" height="3" /><rect x="185" y="155" width="2" height="3" /><rect x="195" y="155" width="2" height="3" /><rect x="205" y="155" width="2" height="3" /><rect x="215" y="155" width="2" height="3" /><rect x="225" y="155" width="2" height="3" /><rect x="235" y="155" width="2" height="3" /><rect x="245" y="155" width="2" height="3" /><rect x="255" y="155" width="2" height="3" /><rect x="265" y="155" width="2" height="3" /><rect x="275" y="155" width="2" height="3" />
  </g>
  
  <!-- USB Controller Chip -->
  <rect x="90" y="80" width="10" height="10" transform="rotate(45, 95, 85)" fill="#222" />

  <!-- Logo and Text -->
  <g fill="#fff" transform="translate(130, 75)">
    <circle cx="20" cy="15" r="12" fill="none" stroke="#fff" stroke-width="2" />
    <path d="M 14 15 L 26 15" stroke="#fff" stroke-width="2" />
    
    <circle cx="45" cy="15" r="12" fill="none" stroke="#fff" stroke-width="2" />
    <path d="M 39 15 L 51 15" stroke="#fff" stroke-width="2" />
    <path d="M 45 9 L 45 21" stroke="#fff" stroke-width="2" />
    
    <text x="65" y="20" font-size="20" font-weight="bold">UNO</text>
    <text x="25" y="40" font-size="12" font-weight="bold">ARDUINO</text>
  </g>

  <!-- LEDs -->
  <rect x="110" y="90" width="6" height="4" fill="#facc15" />
  <text x="100" y="94" fill="#fff" font-size="6" font-weight="bold">L</text>
  
  <rect x="110" y="105" width="6" height="4" fill="#facc15" />
  <text x="100" y="109" fill="#fff" font-size="6" font-weight="bold">TX</text>
  
  <rect x="110" y="115" width="6" height="4" fill="#facc15" />
  <text x="100" y="119" fill="#fff" font-size="6" font-weight="bold">RX</text>
  
  <rect x="265" y="105" width="6" height="4" fill="#22c55e" />
  <text x="275" y="109" fill="#fff" font-size="6" font-weight="bold">ON</text>

  <!-- Headers -->
  <defs>
    <rect id="pin" width="8" height="8" fill="#111" />
    <circle id="hole" cx="4" cy="4" r="2.5" fill="#f8fafc" />
    <g id="header-pin">
      <use href="#pin" />
      <use href="#hole" />
    </g>
  </defs>

  <!-- Top Headers (Digital) -->
  <!-- D8-D13, GND, AREF -->
  <g transform="translate(100, 32)">
    <!-- 10 pins in this block -->
    <rect x="0" y="0" width="80" height="8" fill="#111" />
    <use href="#hole" x="0" y="0" />
    <use href="#hole" x="8" y="0" />
    <use href="#hole" x="16" y="0" />
    <use href="#hole" x="24" y="0" />
    <use href="#hole" x="32" y="0" />
    <use href="#hole" x="40" y="0" />
    <use href="#hole" x="48" y="0" />
    <use href="#hole" x="56" y="0" />
    <use href="#hole" x="64" y="0" />
    <use href="#hole" x="72" y="0" />
    
    <g fill="#fff" font-size="7" font-weight="bold" transform="rotate(-90)" text-anchor="start">
      <!-- 2 SDA/SCL unnamed -->
      <text x="-35" y="19">AREF</text>
      <text x="-35" y="27">GND</text>
      <text x="-35" y="35">13</text>
      <text x="-35" y="43">12</text>
      <text x="-35" y="51">~11</text>
      <text x="-35" y="59">~10</text>
      <text x="-35" y="67">~9</text>
      <text x="-35" y="75">8</text>
    </g>
  </g>

  <!-- D0-D7 -->
  <g transform="translate(190, 32)">
    <rect x="0" y="0" width="64" height="8" fill="#111" />
    <use href="#hole" x="0" y="0" />
    <use href="#hole" x="8" y="0" />
    <use href="#hole" x="16" y="0" />
    <use href="#hole" x="24" y="0" />
    <use href="#hole" x="32" y="0" />
    <use href="#hole" x="40" y="0" />
    <use href="#hole" x="48" y="0" />
    <use href="#hole" x="56" y="0" />
    
    <g fill="#fff" font-size="7" font-weight="bold" transform="rotate(-90)" text-anchor="start">
      <text x="-35" y="7">7</text>
      <text x="-35" y="15">~6</text>
      <text x="-35" y="23">~5</text>
      <text x="-35" y="31">4</text>
      <text x="-35" y="39">~3</text>
      <text x="-35" y="47">2</text>
      <text x="-35" y="55">TX-&gt;1</text>
      <text x="-35" y="63">RX&lt;-0</text>
    </g>
  </g>
  
  <text x="175" y="55" fill="#fff" font-size="8" font-weight="bold">DIGITAL (PWM ~)</text>

  <!-- Bottom Headers (Power and Analog) -->
  <!-- Power -->
  <g transform="translate(140, 215)">
    <rect x="0" y="0" width="64" height="8" fill="#111" />
    <use href="#hole" x="0" y="0" />
    <use href="#hole" x="8" y="0" />
    <use href="#hole" x="16" y="0" />
    <use href="#hole" x="24" y="0" />
    <use href="#hole" x="32" y="0" />
    <use href="#hole" x="40" y="0" />
    <use href="#hole" x="48" y="0" />
    <use href="#hole" x="56" y="0" />
    
    <g fill="#fff" font-size="7" font-weight="bold" transform="rotate(-90)" text-anchor="start">
      <text x="10" y="7">IOREF</text>
      <text x="10" y="15">RESET</text>
      <text x="10" y="23">3.3V</text>
      <text x="10" y="31">5V</text>
      <text x="10" y="39">GND</text>
      <text x="10" y="47">GND</text>
      <text x="10" y="55">Vin</text>
    </g>
    <text x="40" y="-5" fill="#fff" font-size="7" font-weight="bold">POWER</text>
  </g>

  <!-- Analog -->
  <g transform="translate(210, 215)">
    <rect x="0" y="0" width="48" height="8" fill="#111" />
    <use href="#hole" x="0" y="0" />
    <use href="#hole" x="8" y="0" />
    <use href="#hole" x="16" y="0" />
    <use href="#hole" x="24" y="0" />
    <use href="#hole" x="32" y="0" />
    <use href="#hole" x="40" y="0" />
    
    <g fill="#fff" font-size="7" font-weight="bold" transform="rotate(-90)" text-anchor="start">
      <text x="10" y="7">A0</text>
      <text x="10" y="15">A1</text>
      <text x="10" y="23">A2</text>
      <text x="10" y="31">A3</text>
      <text x="10" y="39">A4</text>
      <text x="10" y="47">A5</text>
    </g>
    <text x="15" y="-5" fill="#fff" font-size="7" font-weight="bold">ANALOG IN</text>
  </g>

  <!-- ICSP Header -->
  <g transform="translate(290, 100)">
    <rect x="0" y="0" width="16" height="24" fill="#111" />
    <use href="#hole" x="0" y="0" />
    <use href="#hole" x="8" y="0" />
    <use href="#hole" x="0" y="8" />
    <use href="#hole" x="8" y="8" />
    <use href="#hole" x="0" y="16" />
    <use href="#hole" x="8" y="16" />
  </g>
</svg>
