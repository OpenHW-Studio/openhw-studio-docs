<svg width="450" height="250" viewBox="0 0 450 250" style="font-family: sans-serif; user-select: none;" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Blue PCB -->
  <path d="M 50 30 L 420 30 L 420 100 L 440 120 L 440 230 L 50 230 Z" fill="#296c9c" />

  <!-- USB Type-B Port -->
  <rect x="25" y="45" width="40" height="30" fill="#d4d4d4" stroke="#a3a3a3" />
  <rect x="35" y="50" width="20" height="20" fill="#f5f5f5" />
  
  <!-- DC Barrel Jack -->
  <rect x="25" y="170" width="40" height="30" fill="#111" />
  
  <!-- Main Chip (ATmega2560 TQFP) -->
  <rect x="200" y="100" width="45" height="45" rx="1" fill="#222" />
  <circle cx="205" cy="105" r="2" fill="#111" />
  
  <!-- USB Controller Chip -->
  <rect x="90" y="80" width="10" height="10" transform="rotate(45, 95, 85)" fill="#222" />

  <!-- Logo and Text -->
  <g fill="#fff" transform="translate(190, 160)">
    <text x="25" y="20" font-size="20" font-weight="bold">Arduino MEGA</text>
  </g>

  <!-- LEDs -->
  <rect x="110" y="90" width="6" height="4" fill="#facc15" />
  <text x="120" y="94" fill="#fff" font-size="6" font-weight="bold">L</text>
  
  <rect x="110" y="105" width="6" height="4" fill="#facc15" />
  <text x="120" y="109" fill="#fff" font-size="6" font-weight="bold">TX</text>
  
  <rect x="110" y="115" width="6" height="4" fill="#facc15" />
  <text x="120" y="119" fill="#fff" font-size="6" font-weight="bold">RX</text>

  <!-- Headers -->
  <defs>
    <rect id="pin" width="8" height="8" fill="#111" />
    <circle id="hole" cx="4" cy="4" r="2.5" fill="#f8fafc" />
    <g id="header-pin">
      <use href="#pin" />
      <use href="#hole" />
    </g>
  </defs>

  <!-- Top Headers (Digital / PWM / Comm) -->
  <!-- D14-D21 (Communication) & D8-D13, GND, AREF -->
  <g transform="translate(100, 32)">
    <!-- 24 pins in this block for Mega -->
    <rect x="0" y="0" width="192" height="8" fill="#111" />
    
    <!-- GND, AREF, D13-D8 -->
    <use href="#hole" x="0" y="0" /> <use href="#hole" x="8" y="0" /> <use href="#hole" x="16" y="0" />
    <use href="#hole" x="24" y="0" /> <use href="#hole" x="32" y="0" /> <use href="#hole" x="40" y="0" />
    <use href="#hole" x="48" y="0" /> <use href="#hole" x="56" y="0" /> <use href="#hole" x="64" y="0" /> <use href="#hole" x="72" y="0" />
    
    <!-- D7-D0 -->
    <use href="#hole" x="88" y="0" /> <use href="#hole" x="96" y="0" /> <use href="#hole" x="104" y="0" />
    <use href="#hole" x="112" y="0" /> <use href="#hole" x="120" y="0" /> <use href="#hole" x="128" y="0" />
    <use href="#hole" x="136" y="0" /> <use href="#hole" x="144" y="0" />
    
    <!-- Comm: D14-D21 -->
    <use href="#hole" x="160" y="0" /> <use href="#hole" x="168" y="0" /> <use href="#hole" x="176" y="0" />
    <use href="#hole" x="184" y="0" />
    <use href="#hole" x="192" y="0" /> <use href="#hole" x="200" y="0" /> <use href="#hole" x="208" y="0" />
    <use href="#hole" x="216" y="0" />

    <g fill="#fff" font-size="6" font-weight="bold" transform="rotate(-90)" text-anchor="start">
      <text x="-35" y="19">AREF</text>
      <text x="-35" y="27">GND</text>
      <text x="-35" y="35">13</text>
      <text x="-35" y="43">12</text>
      <text x="-35" y="51">11</text>
      <text x="-35" y="59">10</text>
      <text x="-35" y="67">9</text>
      <text x="-35" y="75">8</text>
      
      <text x="-35" y="91">7</text>
      <text x="-35" y="99">6</text>
      <text x="-35" y="107">5</text>
      <text x="-35" y="115">4</text>
      <text x="-35" y="123">3</text>
      <text x="-35" y="131">2</text>
      <text x="-35" y="139">TX-&gt;1</text>
      <text x="-35" y="147">RX&lt;-0</text>

      <text x="-35" y="163">TX3 14</text>
      <text x="-35" y="171">RX3 15</text>
      <text x="-35" y="179">TX2 16</text>
      <text x="-35" y="187">RX2 17</text>
      
      <text x="-35" y="195">TX1 18</text>
      <text x="-35" y="203">RX1 19</text>
      <text x="-35" y="211">SDA 20</text>
      <text x="-35" y="219">SCL 21</text>
    </g>
  </g>
  
  <text x="175" y="55" fill="#fff" font-size="7" font-weight="bold">PWM</text>
  <text x="270" y="55" fill="#fff" font-size="7" font-weight="bold">COMMUNICATION</text>

  <!-- Bottom Headers (Power and Analog IN 0-15) -->
  <!-- Power -->
  <g transform="translate(100, 215)">
    <rect x="0" y="0" width="64" height="8" fill="#111" />
    <use href="#hole" x="0" y="0" /><use href="#hole" x="8" y="0" /><use href="#hole" x="16" y="0" />
    <use href="#hole" x="24" y="0" /><use href="#hole" x="32" y="0" /><use href="#hole" x="40" y="0" />
    <use href="#hole" x="48" y="0" /><use href="#hole" x="56" y="0" />
    <g fill="#fff" font-size="7" font-weight="bold" transform="rotate(-90)" text-anchor="start">
      <text x="10" y="7">IOREF</text> <text x="10" y="15">RESET</text>
      <text x="10" y="23">3.3V</text> <text x="10" y="31">5V</text>
      <text x="10" y="39">GND</text> <text x="10" y="47">GND</text>
      <text x="10" y="55">Vin</text>
    </g>
    <text x="40" y="-5" fill="#fff" font-size="7" font-weight="bold">POWER</text>
  </g>

  <!-- Analog A0-A7 -->
  <g transform="translate(175, 215)">
    <rect x="0" y="0" width="64" height="8" fill="#111" />
    <use href="#hole" x="0" y="0" /><use href="#hole" x="8" y="0" />
    <use href="#hole" x="16" y="0" /><use href="#hole" x="24" y="0" />
    <use href="#hole" x="32" y="0" /><use href="#hole" x="40" y="0" />
    <use href="#hole" x="48" y="0" /><use href="#hole" x="56" y="0" />
    <g fill="#fff" font-size="7" font-weight="bold" transform="rotate(-90)" text-anchor="start">
      <text x="10" y="7">A0</text> <text x="10" y="15">A1</text>
      <text x="10" y="23">A2</text> <text x="10" y="31">A3</text>
      <text x="10" y="39">A4</text> <text x="10" y="47">A5</text>
      <text x="10" y="55">A6</text> <text x="10" y="63">A7</text>
    </g>
    <text x="25" y="-5" fill="#fff" font-size="7" font-weight="bold">ANALOG IN</text>
  </g>

  <!-- Analog A8-A15 -->
  <g transform="translate(247, 215)">
    <rect x="0" y="0" width="64" height="8" fill="#111" />
    <use href="#hole" x="0" y="0" /><use href="#hole" x="8" y="0" />
    <use href="#hole" x="16" y="0" /><use href="#hole" x="24" y="0" />
    <use href="#hole" x="32" y="0" /><use href="#hole" x="40" y="0" />
    <use href="#hole" x="48" y="0" /><use href="#hole" x="56" y="0" />
    <g fill="#fff" font-size="7" font-weight="bold" transform="rotate(-90)" text-anchor="start">
      <text x="10" y="7">A8</text> <text x="10" y="15">A9</text>
      <text x="10" y="23">A10</text> <text x="10" y="31">A11</text>
      <text x="10" y="39">A12</text> <text x="10" y="47">A13</text>
      <text x="10" y="55">A14</text> <text x="10" y="63">A15</text>
    </g>
  </g>

  <!-- Right Side Double Header (D22 - D53, 5V, GND) -->
  <g transform="translate(390, 32)">
    <rect x="0" y="0" width="16" height="192" fill="#111" />
    <!-- 2 columns of holes -->
    <!-- Column 1 -->
    <use href="#hole" x="0" y="0" /> <use href="#hole" x="0" y="8" /> <use href="#hole" x="0" y="16" />
    <use href="#hole" x="0" y="24" /> <use href="#hole" x="0" y="32" /> <use href="#hole" x="0" y="40" />
    <use href="#hole" x="0" y="48" /> <use href="#hole" x="0" y="56" /> <use href="#hole" x="0" y="64" />
    <use href="#hole" x="0" y="72" /> <use href="#hole" x="0" y="80" /> <use href="#hole" x="0" y="88" />
    <use href="#hole" x="0" y="96" /> <use href="#hole" x="0" y="104" /> <use href="#hole" x="0" y="112" />
    <use href="#hole" x="0" y="120" /> <use href="#hole" x="0" y="128" /> <use href="#hole" x="0" y="136" />
    <use href="#hole" x="0" y="144" /> <use href="#hole" x="0" y="152" /> <use href="#hole" x="0" y="160" />
    <use href="#hole" x="0" y="168" /> <use href="#hole" x="0" y="176" /> <use href="#hole" x="0" y="184" />
    
    <!-- Column 2 -->
    <use href="#hole" x="8" y="0" /> <use href="#hole" x="8" y="8" /> <use href="#hole" x="8" y="16" />
    <use href="#hole" x="8" y="24" /> <use href="#hole" x="8" y="32" /> <use href="#hole" x="8" y="40" />
    <use href="#hole" x="8" y="48" /> <use href="#hole" x="8" y="56" /> <use href="#hole" x="8" y="64" />
    <use href="#hole" x="8" y="72" /> <use href="#hole" x="8" y="80" /> <use href="#hole" x="8" y="88" />
    <use href="#hole" x="8" y="96" /> <use href="#hole" x="8" y="104" /> <use href="#hole" x="8" y="112" />
    <use href="#hole" x="8" y="120" /> <use href="#hole" x="8" y="128" /> <use href="#hole" x="8" y="136" />
    <use href="#hole" x="8" y="144" /> <use href="#hole" x="8" y="152" /> <use href="#hole" x="8" y="160" />
    <use href="#hole" x="8" y="168" /> <use href="#hole" x="8" y="176" /> <use href="#hole" x="8" y="184" />
  </g>

  <!-- ICSP Header -->
  <g transform="translate(290, 80)">
    <rect x="0" y="0" width="16" height="24" fill="#111" />
    <use href="#hole" x="0" y="0" /> <use href="#hole" x="8" y="0" />
    <use href="#hole" x="0" y="8" /> <use href="#hole" x="8" y="8" />
    <use href="#hole" x="0" y="16" /> <use href="#hole" x="8" y="16" />
    
    <rect x="25" y="4" width="12" height="12" fill="#fff" />
    <circle cx="31" cy="10" r="3" fill="#ef4444" />
  </g>
</svg>
