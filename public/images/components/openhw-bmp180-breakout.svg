<svg viewBox="0 0 72 50" width="72" height="50" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="enigGold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FDE047" />
            <stop offset="50%" stop-color="#EAB308" />
            <stop offset="100%" stop-color="#CA8A04" />
        </linearGradient>
        <linearGradient id="brushedMetal" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#F1F5F9" />
            <stop offset="30%" stop-color="#CBD5E1" />
            <stop offset="50%" stop-color="#E2E8F0" />
            <stop offset="70%" stop-color="#94A3B8" />
            <stop offset="100%" stop-color="#F8FAFC" />
        </linearGradient>
        <radialGradient id="sensorHole" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#000000" />
            <stop offset="70%" stop-color="#1E293B" />
            <stop offset="100%" stop-color="#475569" />
        </radialGradient>
        <linearGradient id="pcbBase" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1E3A8A" />
            <stop offset="100%" stop-color="#172554" />
        </linearGradient>
    </defs>

    <!-- Deep Blue PCB Background -->
    <rect x="1" y="1" width="70" height="48" rx="4" ry="4" fill="url(#pcbBase)" stroke="#1E40AF" stroke-width="0.5" />

    <!-- Trace routing (lighter blue simulating copper under mask) -->
    <path d="M 10 38 L 10 46 M 25 38 L 25 46 M 40 38 L 40 46 M 55 38 L 55 46" fill="none" stroke="#2563EB" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
    <path d="M 10 38 L 22 26 L 36 26" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.4" />
    <path d="M 40 38 L 44 32 L 44 26" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.4" />
    <path d="M 55 38 L 50 32 L 50 26" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.4" />

    <!-- Mounting Holes (Plated with ENIG Gold) -->
    <circle cx="8" cy="8" r="3.5" fill="url(#enigGold)" />
    <circle cx="8" cy="8" r="2.5" fill="#111827" /> <!-- Through-hole -->
    <circle cx="64" cy="8" r="3.5" fill="url(#enigGold)" />
    <circle cx="64" cy="8" r="2.5" fill="#111827" />

    <!-- - Surface Mount Components - -->
    <!-- 3.3V Voltage Regulator (SOT-23) -->
    <rect x="15" y="14" width="5" height="7" fill="#111827" rx="0.5" />
    <rect x="14" y="14.5" width="1" height="1.5" fill="#94A3B8" />
    <rect x="14" y="19" width="1" height="1.5" fill="#94A3B8" />
    <rect x="20" y="16.75" width="1" height="1.5" fill="#94A3B8" />

    <!-- I2C Pull-up Resistors (0603 footprint) -->
    <g transform="translate(36, 12)">
        <rect x="0" y="0" width="2" height="4" fill="#0F172A" rx="0.2" />
        <rect x="0" y="0" width="2" height="0.8" fill="#94A3B8" rx="0.2" />
        <rect x="0" y="3.2" width="2" height="0.8" fill="#94A3B8" rx="0.2" />
    </g>
    <g transform="translate(41, 12)">
        <rect x="0" y="0" width="2" height="4" fill="#0F172A" rx="0.2" />
        <rect x="0" y="0" width="2" height="0.8" fill="#94A3B8" rx="0.2" />
        <rect x="0" y="3.2" width="2" height="0.8" fill="#94A3B8" rx="0.2" />
    </g>

    <!-- Decoupling Capacitors (Brown ceramic) -->
    <g transform="translate(25, 12)">
        <rect x="0" y="0" width="2" height="4" fill="#A16207" rx="0.2" />
        <rect x="0" y="0" width="2" height="0.8" fill="#94A3B8" rx="0.2" />
        <rect x="0" y="3.2" width="2" height="0.8" fill="#94A3B8" rx="0.2" />
    </g>

    <!-- - BMP180 Sensor Package - -->
    <!-- Dynamic Atmospheric Pressure Aura -->
    <circle cx="36" cy="27" r="12" fill="hsla(180, 80%, 60%, 0.6)" style="filter: blur(3px); mix-blend-mode: screen;" />

    <!-- Metal Can Package -->
    <rect x="30" y="21" width="12" height="12" rx="1.5" fill="url(#brushedMetal)" stroke="#64748B" stroke-width="0.5" />
    
    <!-- Pressure Port (Deep hole) -->
    <circle cx="39" cy="24" r="1.5" fill="url(#sensorHole)" />
    <circle cx="39" cy="24" r="0.8" fill="#000" />
    
    <!-- Engraved Silicon Markings -->
    <text x="36" y="29.5" font-family="sans-serif" font-size="2.5" fill="#64748B" font-weight="bold" text-anchor="middle" style="opacity: 0.8;">BMP</text>
    <text x="36" y="32" font-family="sans-serif" font-size="2" fill="#64748B" text-anchor="middle" style="opacity: 0.8;">180</text>

    <!-- - Breadboard Connection Pins - -->
    <!-- ENIG Gold Plated Pads -->
    <rect x="7.5" y="44" width="5" height="5" fill="url(#enigGold)" rx="1" />
    <rect x="22.5" y="44" width="5" height="5" fill="url(#enigGold)" rx="1" />
    <rect x="37.5" y="44" width="5" height="5" fill="url(#enigGold)" rx="1" />
    <rect x="52.5" y="44" width="5" height="5" fill="url(#enigGold)" rx="1" />

    <!-- Physical Male Header Pins extending out -->
    <path d="M 9.2 46.5 L 9.2 49.5 A 0.8 0.8 0 0 0 10.8 49.5 L 10.8 46.5 Z" fill="url(#brushedMetal)" />
    <path d="M 24.2 46.5 L 24.2 49.5 A 0.8 0.8 0 0 0 25.8 49.5 L 25.8 46.5 Z" fill="url(#brushedMetal)" />
    <path d="M 39.2 46.5 L 39.2 49.5 A 0.8 0.8 0 0 0 40.8 49.5 L 40.8 46.5 Z" fill="url(#brushedMetal)" />
    <path d="M 54.2 46.5 L 54.2 49.5 A 0.8 0.8 0 0 0 55.8 49.5 L 55.8 46.5 Z" fill="url(#brushedMetal)" />

    <!-- Exact Anchor Points at y=48 -->
    <circle cx="10" cy="48" r="1.2" fill="#111827" />
    <circle cx="25" cy="48" r="1.2" fill="#111827" />
    <circle cx="40" cy="48" r="1.2" fill="#111827" />
    <circle cx="55" cy="48" r="1.2" fill="#111827" />

    <!-- Silkscreen Pin Labels -->
    <text x="10" y="42" font-family="monospace" font-size="4.5" font-weight="bold" fill="#F8FAFC" text-anchor="middle">VIN</text>
    <text x="25" y="42" font-family="monospace" font-size="4.5" font-weight="bold" fill="#F8FAFC" text-anchor="middle">GND</text>
    <text x="40" y="42" font-family="monospace" font-size="4.5" font-weight="bold" fill="#F8FAFC" text-anchor="middle">SCL</text>
    <text x="55" y="42" font-family="monospace" font-size="4.5" font-weight="bold" fill="#F8FAFC" text-anchor="middle">SDA</text>
    
    <!-- Board Identifier Silkscreen -->
    <text x="36" y="6" font-family="sans-serif" font-size="3" font-weight="bold" fill="#F8FAFC" text-anchor="middle" opacity="0.8">BMP180 Breakout</text>
</svg>
