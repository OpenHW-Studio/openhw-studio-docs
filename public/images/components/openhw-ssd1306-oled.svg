<svg width="135" height="120" viewBox="0 0 135 120" xmlns="http://www.w3.org/2000/svg" style="display: block;">
    <rect width="135" height="120" fill="#104271" rx="4" />

    <!-- Mounting holes -->
    <circle cx="10" cy="10" r="5" fill="#FFFFFF" />
    <circle cx="125" cy="10" r="5" fill="#FFFFFF" />
    <circle cx="10" cy="110" r="5" fill="#FFFFFF" />
    <circle cx="125" cy="110" r="5" fill="#FFFFFF" />

    <!-- I2C Header Plastic -->
    <rect x="25" y="4" width="66" height="16" fill="#222" rx="2" />

    <!-- Pins at 30, 45, 60, 75 (15px pitch) -->
    <circle cx="30" cy="7.5" r="3.5" stroke="#E5B85C" stroke-width="2" fill="#FFFFFF" />
    <circle cx="45" cy="7.5" r="3.5" stroke="#E5B85C" stroke-width="2" fill="#FFFFFF" />
    <circle cx="60" cy="7.5" r="3.5" stroke="#E5B85C" stroke-width="2" fill="#FFFFFF" />
    <circle cx="75" cy="7.5" r="3.5" stroke="#E5B85C" stroke-width="2" fill="#FFFFFF" />

    <text x="30" y="26" fill="#FFFFFF" font-size="5" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">GND</text>
    <text x="45" y="26" fill="#FFFFFF" font-size="5" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">VCC</text>
    <text x="60" y="26" fill="#FFFFFF" font-size="5" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">SCL</text>
    <text x="75" y="26" fill="#FFFFFF" font-size="5" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">SDA</text>

    <!-- Screen area -->
    <rect x="8" y="30" width="107.5" height="65" fill="#050505" rx="2" />
    <rect x="9" y="31" width="105.5" height="63" fill="#111" rx="1" />

    <text x="67.5" y="108" fill="#FFFFFF" font-size="7" text-anchor="middle" opacity="0.5">SSD1306 OLED</text>
</svg>
