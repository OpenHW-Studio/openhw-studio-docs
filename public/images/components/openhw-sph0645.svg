<svg width="100" height="120" viewBox="0 0 100 120" style="font-family: sans-serif; user-select: none;" xmlns="http://www.w3.org/2000/svg">
  <!-- Blue Circular PCB -->
  <circle cx="50" cy="50" r="45" fill="#1e1b4b" stroke="#0f172a" stroke-width="2" />
  
  <!-- Microphone Hole -->
  <circle cx="50" cy="50" r="10" fill="#111" />
  <circle cx="50" cy="50" r="8" fill="#171717" />
  
  <!-- SMT Component outlines faintly visible -->
  <circle cx="25" cy="25" r="4" fill="none" stroke="#059669" stroke-width="1.5" opacity="0.6" />
  
  <text x="50" y="80" fill="#e11d48" font-size="5" font-weight="bold" text-anchor="middle" opacity="0.6">Mic Breakout</text>

  <!-- Output Pins (Bottom Edge) -->
  
  <!-- 3V -->
  <text x="25" y="93" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">3V</text>
  <rect x="23" y="95" width="4" height="2" fill="#d4af37" />
  <rect x="23" y="97" width="4" height="8" fill="#facc15" rx="1" />
  <circle cx="25" cy="101" r="1.5" fill="#111" />
  
  <!-- GND -->
  <text x="35" y="93" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">GND</text>
  <rect x="33" y="95" width="4" height="2" fill="#d4af37" />
  <rect x="33" y="97" width="4" height="8" fill="#facc15" rx="1" />
  <circle cx="35" cy="101" r="1.5" fill="#111" />
  
  <!-- BCLK -->
  <text x="45" y="93" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">BCLK</text>
  <rect x="43" y="95" width="4" height="2" fill="#d4af37" />
  <rect x="43" y="97" width="4" height="8" fill="#facc15" rx="1" />
  <circle cx="45" cy="101" r="1.5" fill="#111" />
  
  <!-- DOUT -->
  <text x="55" y="93" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">DOUT</text>
  <rect x="53" y="95" width="4" height="2" fill="#d4af37" />
  <rect x="53" y="97" width="4" height="8" fill="#facc15" rx="1" />
  <circle cx="55" cy="101" r="1.5" fill="#111" />
  
  <!-- LRCL -->
  <text x="65" y="93" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">LRCL</text>
  <rect x="63" y="95" width="4" height="2" fill="#d4af37" />
  <rect x="63" y="97" width="4" height="8" fill="#facc15" rx="1" />
  <circle cx="65" cy="101" r="1.5" fill="#111" />
  
  <!-- SEL -->
  <text x="75" y="93" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">SEL</text>
  <rect x="73" y="95" width="4" height="2" fill="#d4af37" />
  <rect x="73" y="97" width="4" height="8" fill="#facc15" rx="1" />
  <circle cx="75" cy="101" r="1.5" fill="#111" />

</svg>
