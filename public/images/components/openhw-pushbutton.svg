<svg width="75" height="60" viewBox="0 0 75 60" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="grad-up" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="0.3" stop-color="#22c55e" />
            <stop offset="0.5" stop-color="#22c55e" />
            <stop offset="1" stop-color="#000000" stop-opacity="0.4" />
        </linearGradient>
    </defs>

    <!-- Stamped Metal Legs -->
    <g fill="#b3b3b3">
        <rect x="0" y="13.5" width="13.5" height="3" rx="0.5" />
        <rect x="0" y="43.5" width="13.5" height="3" rx="0.5" />
        <rect x="61.5" y="13.5" width="13.5" height="3" rx="0.5" />
        <rect x="61.5" y="43.5" width="13.5" height="3" rx="0.5" />
    </g>

    <!-- Main Metal Body (48x48 centered in 75x60) -->
    <rect x="13.5" y="6" width="48" height="48" rx="1.76" ry="1.76" fill="#464646" />
    
    <!-- Metallic Inner Plate -->
    <rect x="16.5" y="9" width="42" height="42" rx="0.84" ry="0.84" fill="#eaeaea" />

    <!-- Plunger -->
    <g>
        <!-- Outer gradient ring -->
        <circle cx="37.5" cy="30" r="15.28" fill="url(#grad-up)" />
        
        <!-- Inner colored circle -->
        <circle cx="37.5" cy="30" r="11.6" fill="#22c55e" stroke="#2f2f2f" stroke-opacity="0.47" stroke-width="0.32" />
    </g>
</svg>
