<svg width="80" height="60" viewBox="0 0 80 60" xmlns="http://www.w3.org/2000/svg" style="pointer-events: none;">
    <defs>
      <linearGradient id="routerBody" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1e293b" />
        <stop offset="100%" stop-color="#0f172a" />
      </linearGradient>
      <linearGradient id="antennaGradient" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#334155" />
        <stop offset="50%" stop-color="#475569" />
        <stop offset="100%" stop-color="#1e293b" />
      </linearGradient>
      <filter id="glowGreen">
        <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
        <feMerge>
          <feMergeNode in="coloredBlur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <!-- Antennas -->
    <g stroke="#111827" stroke-width="0.5">
      <rect x="23" y="12" width="3" height="18" rx="1" fill="url(#antennaGradient)" transform="rotate(-15, 24.5, 30)" />
      <rect x="54" y="12" width="3" height="18" rx="1" fill="url(#antennaGradient)" transform="rotate(15, 55.5, 30)" />
      <circle cx="24.5" cy="30" r="2.5" fill="#1e293b" transform="rotate(-15, 24.5, 30)" />
      <circle cx="55.5" cy="30" r="2.5" fill="#1e293b" transform="rotate(15, 55.5, 30)" />
    </g>

    <!-- Router Base -->
    <path d="M 15 35 Q 40 32 65 35 L 70 48 Q 40 53 10 48 Z" fill="url(#routerBody)" stroke="#334155" stroke-width="0.5" />
    <!-- Router Base highlight -->
    <path d="M 16 36 Q 40 33 64 36" fill="none" stroke="#64748b" stroke-width="0.5" opacity="0.5" />
    
    <!-- Status LEDs -->
    <g transform="translate(40, 46)">
      <!-- PWR -->
      <circle cx="-8" cy="0" r="1.2" fill="#4ade80" filter="url(#glowGreen)" />
      <!-- WAN -->
      <circle cx="0" cy="0" r="1.2" fill="#4ade80" filter="url(#glowGreen)" />
      <!-- WLAN -->
      <circle cx="8" cy="0" r="1.2" fill="#38bdf8" />
    </g>

    <!-- Animated WiFi Arcs coming from center above router -->
    <g transform="translate(40, 22)">
      <path d="M -2.5 0 A 2.5 2.5 0 0 1 2.5 0" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
      <path d="M -6 -3 A 7 7 0 0 1 6 -3" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
      <path d="M -11 -7 A 13 13 0 0 1 11 -7" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- SSID and Channel Label -->
    <text
      x="40" y="58"
      text-anchor="middle"
      font-size="5"
      font-family="monospace"
      fill="#94a3b8"
      font-weight="bold"
    >
      OpenHW-GUEST (CH6)
    </text>
</svg>
