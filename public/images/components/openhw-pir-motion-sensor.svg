<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="font-family: sans-serif;">
  <!-- Blue PCB Base -->
  <rect x="15" y="10" width="70" height="65" fill="#1e3a8a" />
  
  <!-- Mounting Holes -->
  <circle cx="20" cy="42.5" r="4" fill="#ffffff" />
  <circle cx="80" cy="42.5" r="4" fill="#ffffff" />

  <!-- White Plastic Dome Base -->
  <rect x="25" y="12" width="50" height="50" fill="#e2e8f0" />
  <rect x="27" y="14" width="46" height="46" fill="#cbd5e1" opacity="0.5" />

  <!-- Fresnel Lens Dome -->
  <circle cx="50" cy="37" r="23" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
  <circle cx="50" cy="37" r="21" fill="none" stroke="#e2e8f0" stroke-width="1" />
  
  <!-- Hexagon Pattern (Fresnel Lens detail) -->
  <defs>
    <pattern id="hexagons" width="10" height="17.32" patternUnits="userSpaceOnUse" patternTransform="scale(0.8)">
      <path d="M5 0 L10 2.88 L10 8.66 L5 11.54 L0 8.66 L0 2.88 Z M5 17.32 L10 14.44 L10 8.66 L5 5.78 L0 8.66 L0 14.44 Z" fill="none" stroke="#cbd5e1" stroke-width="0.75" />
    </pattern>
  </defs>
  <circle cx="50" cy="37" r="21" fill="url(#hexagons)" opacity="0.5" />

  <!-- Dome Highlights -->
  <path d="M 40 20 A 18 18 0 0 1 65 30" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <path d="M 38 48 A 18 18 0 0 0 55 53" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />

  <!-- PCB Labels -->
  <text x="43" y="71" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">+</text>
  <text x="50" y="71" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">D</text>
  <text x="57" y="71" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">-</text>

  <!-- Pins -->
  <rect x="42" y="75" width="2" height="15" fill="#d4af37" />
  <rect x="49" y="75" width="2" height="15" fill="#d4af37" />
  <rect x="56" y="75" width="2" height="15" fill="#d4af37" />
</svg>
