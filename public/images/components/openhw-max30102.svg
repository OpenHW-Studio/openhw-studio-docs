<svg width="200" height="160" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg" style="display: block;">
    <defs>
        <!-- ── PCB cutout mask (verbatim from original SVG) ── -->
        <mask id="max30102-pcb-mask">
            <rect x="0" y="0" width="200" height="160" fill="white" />
            <!-- Slot mounts -->
            <rect x="18" y="40" width="8" height="80" rx="4" fill="black" />
            <rect x="174" y="40" width="8" height="80" rx="4" fill="black" />
            <!-- Through-hole pads – inner pads -->
            <circle cx="50" cy="35" r="4" fill="black" />
            <circle cx="50" cy="125" r="4" fill="black" />
            <circle cx="83" cy="35" r="4" fill="black" />
            <circle cx="83" cy="125" r="4" fill="black" />
            <circle cx="116" cy="35" r="4" fill="black" />
            <circle cx="116" cy="125" r="4" fill="black" />
            <circle cx="150" cy="35" r="4" fill="black" />
            <circle cx="150" cy="125" r="4" fill="black" />
            <!-- Through-hole pads – outer edge -->
            <circle cx="50" cy="10" r="4.5" fill="black" />
            <circle cx="50" cy="150" r="4.5" fill="black" />
            <circle cx="83" cy="10" r="4.5" fill="black" />
            <circle cx="83" cy="150" r="4.5" fill="black" />
            <circle cx="116" cy="10" r="4.5" fill="black" />
            <circle cx="116" cy="150" r="4.5" fill="black" />
            <circle cx="150" cy="10" r="4.5" fill="black" />
            <circle cx="150" cy="150" r="4.5" fill="black" />
        </mask>
    </defs>

    <g mask="url(#max30102-pcb-mask)">
        <!-- ── PCB substrate ── -->
        <rect x="10" y="10" width="180" height="140" rx="15" fill="#121212" />

        <!-- ── Slot mount outlines ── -->
        <rect x="18" y="40" width="8" height="80" rx="4" fill="none" stroke="#D4AF37" stroke-width="3" />
        <rect x="174" y="40" width="8" height="80" rx="4" fill="none" stroke="#D4AF37" stroke-width="3" />

        <!-- ── Inner via rings (both rows) ── -->
        <circle cx="50" cy="35" r="5.5" fill="none" stroke="#D4AF37" stroke-width="3" />
        <circle cx="50" cy="125" r="5.5" fill="none" stroke="#D4AF37" stroke-width="3" />
        <circle cx="83" cy="35" r="5.5" fill="none" stroke="#D4AF37" stroke-width="3" />
        <circle cx="83" cy="125" r="5.5" fill="none" stroke="#D4AF37" stroke-width="3" />
        <circle cx="116" cy="35" r="5.5" fill="none" stroke="#D4AF37" stroke-width="3" />
        <circle cx="116" cy="125" r="5.5" fill="none" stroke="#D4AF37" stroke-width="3" />
        <circle cx="150" cy="35" r="5.5" fill="none" stroke="#D4AF37" stroke-width="3" />
        <circle cx="150" cy="125" r="5.5" fill="none" stroke="#D4AF37" stroke-width="3" />

        <!-- ── Top connector pads (VIN / SCL / SDA / INT) ── -->
        <rect x="42.5" y="10" width="15" height="14" fill="#D4AF37" />
        <rect x="75.5" y="10" width="15" height="14" fill="#D4AF37" />
        <rect x="108.5" y="10" width="15" height="14" fill="#D4AF37" />
        <rect x="142.5" y="10" width="15" height="14" fill="#D4AF37" />

        <!-- ── Bottom connector pads (IRD / RD / GND / NC) ── -->
        <rect x="42.5" y="136" width="15" height="14" fill="#D4AF37" />
        <rect x="75.5" y="136" width="15" height="14" fill="#D4AF37" />
        <rect x="108.5" y="136" width="15" height="14" fill="#D4AF37" />
        <rect x="142.5" y="136" width="15" height="14" fill="#D4AF37" />

        <!-- ── MAX30102 optical sensor IC package ── -->
        <rect x="85" y="55" width="30" height="50" rx="2" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="2" />
        <!-- IC window -->
        <rect x="90" y="65" width="20" height="30" fill="#050505" />

        <!-- ── RED LED (660 nm) ── -->
        <rect x="94" y="70" width="12" height="8" fill="#8B0000" />

        <!-- ── IR LED (880 nm) ── -->
        <rect x="94" y="82" width="12" height="10" fill="#222222" />

        <!-- IC lead fingers – left side -->
        <rect x="86" y="65" width="2" height="4" fill="#D4AF37" />
        <rect x="86" y="75" width="2" height="4" fill="#D4AF37" />
        <rect x="86" y="85" width="2" height="4" fill="#D4AF37" />
        <!-- IC lead fingers – right side -->
        <rect x="112" y="65" width="2" height="4" fill="#D4AF37" />
        <rect x="112" y="75" width="2" height="4" fill="#D4AF37" />
        <rect x="112" y="85" width="2" height="4" fill="#D4AF37" />

        <!-- ── Passive components (fixed decoration) ── -->
        <!-- 65K5 decoupling capacitor -->
        <rect x="35" y="65" width="20" height="12" rx="1" fill="#222" />
        <text x="45" y="73" font-size="6" fill="#777" font-family="sans-serif" text-anchor="middle">65K5</text>
        <rect x="35" y="50" width="10" height="6" fill="#C19A6B" />
        <rect x="62" y="65" width="6" height="12" fill="#C19A6B" />

        <!-- 472Ω resistors -->
        <g>
            <rect x="42" y="95" width="8" height="14" fill="#111" stroke="#ccc" stroke-width="1" />
            <text x="46" y="104" font-size="4" fill="#aaa" font-family="sans-serif" text-anchor="middle" transform="rotate(-90 46 104)">472</text>
        </g>
        <g>
            <rect x="56" y="95" width="8" height="14" fill="#111" stroke="#ccc" stroke-width="1" />
            <text x="60" y="104" font-size="4" fill="#aaa" font-family="sans-serif" text-anchor="middle" transform="rotate(-90 60 104)">472</text>
        </g>
        <g>
            <rect x="70" y="95" width="8" height="14" fill="#111" stroke="#ccc" stroke-width="1" />
            <text x="74" y="104" font-size="4" fill="#aaa" font-family="sans-serif" text-anchor="middle" transform="rotate(-90 74 104)">472</text>
        </g>

        <!-- N1IF IC and surrounding caps -->
        <rect x="135" y="85" width="20" height="14" rx="1" fill="#222" />
        <text x="145" y="94" font-size="6" fill="#777" font-family="sans-serif" text-anchor="middle">N1IF</text>
        <rect x="120" y="60" width="8" height="14" fill="#C19A6B" />
        <rect x="135" y="60" width="8" height="14" fill="#C19A6B" />
        <rect x="150" y="60" width="8" height="14" fill="#C19A6B" />
        <rect x="125" y="85" width="6" height="12" fill="#C19A6B" />
    </g>
</svg>
