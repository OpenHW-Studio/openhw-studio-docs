<svg width="75" height="60" viewBox="0 0 75 60" style="pointer-events: none;" xmlns="http://www.w3.org/2000/svg">
    <!-- Input wires -->
    <line x1="0" y1="15" x2="20" y2="15" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="45" x2="20" y2="45" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" />

    <!-- D-shape body -->
    <defs>
        <linearGradient id="nandGateFill" x1="20" y1="10" x2="55" y2="30" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#c084fc" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05" />
        </linearGradient>
    </defs>
    <path
        d="M 20 10 L 40 10 A 20 20 0 0 1 40 50 L 20 50 Z"
        fill="url(#nandGateFill)"
        stroke="#a855f7"
        stroke-width="2"
        stroke-linejoin="round"
        stroke-linecap="round"
    />

    <!-- Inversion Circle -->
    <circle cx="63" cy="30" r="3" fill="transparent" stroke="#a855f7" stroke-width="2" />

    <!-- Output wire -->
    <line x1="66" y1="30" x2="75" y2="30" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" />
</svg>
