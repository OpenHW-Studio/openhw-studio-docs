<svg width="150" height="200" viewBox="0 0 150 200" xmlns="http://www.w3.org/2000/svg" style="display: block;">
    <!-- Motor Body Capsule -->
    <rect x="35" y="20" width="80" height="160" rx="40" fill="#444" stroke="#222" stroke-width="2" />
    
    <!-- Mounting Holes -->
    <circle cx="35" cy="50" r="4" fill="#666" stroke="#222" stroke-width="1" />
    <circle cx="115" cy="50" r="4" fill="#666" stroke="#222" stroke-width="1" />
    <circle cx="35" cy="150" r="4" fill="#666" stroke="#222" stroke-width="1" />
    <circle cx="115" cy="150" r="4" fill="#666" stroke="#222" stroke-width="1" />
    
    <!-- Spider Web Ridges -->
    <line x1="35" y1="50" x2="115" y2="50" stroke="#555" stroke-width="3" />
    <line x1="35" y1="100" x2="115" y2="100" stroke="#555" stroke-width="3" />
    <line x1="35" y1="150" x2="115" y2="150" stroke="#555" stroke-width="3" />
    <line x1="75" y1="20" x2="75" y2="180" stroke="#555" stroke-width="3" />
    <line x1="45" y1="30" x2="105" y2="70" stroke="#555" stroke-width="2" />
    <line x1="45" y1="70" x2="105" y2="30" stroke="#555" stroke-width="2" />
    <line x1="45" y1="130" x2="105" y2="170" stroke="#555" stroke-width="2" />
    <line x1="45" y1="170" x2="105" y2="130" stroke="#555" stroke-width="2" />
    
    <!-- Central Hub -->
    <circle cx="75" cy="65" r="12" fill="#555" />
    <circle cx="75" cy="65" r="7" fill="#888" />
    <circle cx="75" cy="65" r="3" fill="#eab308" />
    
    <!-- Hands -->
    <!-- Inner Hand (Gold) -->
    <line x1="75" y1="65" x2="75" y2="30" stroke="#eab308" stroke-width="3" stroke-linecap="round" />
    <circle cx="75" cy="65" r="1.5" fill="#fff" />
    <!-- Outer Hand (Silver) -->
    <line x1="75" y1="65" x2="100" y2="65" stroke="#d4d4d8" stroke-width="2" stroke-linecap="round" />
    
    <!-- 8 Pins on left side -->
    <g transform="translate(25, 75)">
        <rect x="0" y="0" width="10" height="2" fill="#aaa" />
        <rect x="0" y="6" width="10" height="2" fill="#aaa" />
        <rect x="0" y="12" width="10" height="2" fill="#aaa" />
        <rect x="0" y="18" width="10" height="2" fill="#aaa" />
        <rect x="0" y="30" width="10" height="2" fill="#aaa" />
        <rect x="0" y="36" width="10" height="2" fill="#aaa" />
        <rect x="0" y="42" width="10" height="2" fill="#aaa" />
        <rect x="0" y="48" width="10" height="2" fill="#aaa" />
    </g>
</svg>
