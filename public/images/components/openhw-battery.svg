<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" style="display: block;">
  <defs>
      <linearGradient id="cellBody" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#1e3a8a" />
          <stop offset="20%" stop-color="#2563eb" />
          <stop offset="50%" stop-color="#3b82f6" />
          <stop offset="80%" stop-color="#1d4ed8" />
          <stop offset="100%" stop-color="#1e3a8a" />
      </linearGradient>
      <linearGradient id="cellHighlight" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="rgba(255,255,255,0)" />
          <stop offset="25%" stop-color="rgba(255,255,255,0.4)" />
          <stop offset="40%" stop-color="rgba(255,255,255,0)" />
      </linearGradient>
      <linearGradient id="metalTerminal" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#94a3b8" />
          <stop offset="50%" stop-color="#f1f5f9" />
          <stop offset="100%" stop-color="#64748b" />
      </linearGradient>
  </defs>

  <!-- Wiring -->
  <path d="M 0 15 L 30 15" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 0 45 C 15 45, 15 105, 30 105" fill="none" stroke="#111827" stroke-width="2.5" stroke-linecap="round" />

  <!-- Battery Holder -->
  <rect x="25" y="5" width="65" height="110" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <path d="M 45 105 L 75 105 M 45 108 L 75 108 M 45 111 L 75 111" fill="none" stroke="#64748b" stroke-width="1.5" />
  <rect x="50" y="5" width="20" height="4" fill="#64748b" />

  <!-- LED Charge Indicator on Holder -->
  <rect x="30" y="15" width="4" height="90" rx="2" fill="#09090b" stroke="#27272a" stroke-width="0.5" />
  <rect 
      x="30" 
      y="15" 
      width="4" 
      height="90" 
      rx="2" 
      fill="#10b981" 
      style="filter: drop-shadow(0px 0px 3px #10b981);"
  />

  <!-- 18650 Li-ion Cell -->
  <!-- Positive Terminal Insulator Ring -->
  <rect x="40" y="12" width="40" height="4" rx="1" fill="#f8fafc" />
  <rect x="42" y="12" width="36" height="4" fill="url(#metalTerminal)" />
  <!-- Positive Bump -->
  <rect x="50" y="9" width="20" height="3" rx="1" fill="url(#metalTerminal)" />
  
  <!-- Main Cylindrical Body (Blue Shrink Wrap) -->
  <rect x="40" y="14" width="40" height="92" rx="2" fill="url(#cellBody)" />
  <!-- Top edge overlap of shrink wrap -->
  <rect x="40" y="14" width="40" height="1.5" fill="#1e3a8a" opacity="0.8" />
  
  <!-- Glossy 3D Cylinder Highlight -->
  <rect x="40" y="14" width="40" height="92" rx="2" fill="url(#cellHighlight)" />

  <!-- Printed Cell Markings -->
  <text x="72" y="60" fill="#ffffff" font-size="6" font-weight="bold" transform="rotate(-90, 72, 60)" opacity="0.7">18650 Li-ion 3.7V</text>
  <text x="60" y="60" fill="#ffffff" font-size="10" font-weight="bold" transform="rotate(-90, 60, 60)" opacity="0.9">2000mAh</text>
  
  <text x="50" y="95" fill="#ffffff" font-size="10" font-weight="bold" transform="rotate(-90, 50, 95)" opacity="0.6">100%</text>

  <!-- Breadboard Connection Pins -->
  <circle cx="0" cy="15" r="2" fill="#FDE047" stroke="#CA8A04" stroke-width="0.5" />
  <circle cx="0" cy="45" r="2" fill="#FDE047" stroke="#CA8A04" stroke-width="0.5" />
  
  <text x="4" y="13" fill="#ef4444" font-size="6" font-weight="bold" font-family="monospace">VCC</text>
  <text x="4" y="43" fill="#94a3b8" font-size="6" font-weight="bold" font-family="monospace">GND</text>
</svg>
