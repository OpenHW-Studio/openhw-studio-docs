<svg viewBox="0 0 200 300" width="100" height="150" xmlns="http://www.w3.org/2000/svg">
    <!-- PCB Base -->
    <rect x="20" y="20" width="160" height="190" fill="#111318" rx="6" />
    <!-- Inner White Silkscreen Border -->
    <rect x="25" y="25" width="150" height="180" fill="none" stroke="#f3f4f6" stroke-width="2" rx="3" />
    
    <!-- Mounting Holes -->
    <circle cx="45" cy="45" r="10" fill="#374151" />
    <circle cx="45" cy="45" r="5" fill="#e2e8f0" />
    <circle cx="155" cy="185" r="10" fill="#374151" />
    <circle cx="155" cy="185" r="5" fill="#e2e8f0" />

    <!-- IR Symbol (Top Right) -->
    <path d="M 145 55 Q 155 45 165 55 M 140 45 Q 155 30 170 45 M 135 35 Q 155 15 175 35" fill="none" stroke="#f3f4f6" stroke-width="2" stroke-linecap="round" />

    <!-- --- Bottom Pins --- -->
    <g>
        <!-- Pin 1 (Left / G) -->
        <rect x="66" y="230" width="8" height="60" fill="#9ca3af" rx="2" />
        <rect x="66" y="230" width="3" height="60" fill="#f3f4f6" rx="1" />
        
        <!-- Pin 2 (Middle / V) -->
        <rect x="96" y="230" width="8" height="60" fill="#9ca3af" rx="2" />
        <rect x="96" y="230" width="3" height="60" fill="#f3f4f6" rx="1" />

        <!-- Pin 3 (Right / R) -->
        <rect x="126" y="230" width="8" height="60" fill="#9ca3af" rx="2" />
        <rect x="126" y="230" width="3" height="60" fill="#f3f4f6" rx="1" />
    </g>

    <!-- Black Plastic Header Block -->
    <rect x="50" y="210" width="100" height="20" fill="#030712" rx="3" />
    <rect x="55" y="200" width="90" height="10" fill="#1f2937" rx="2" />

    <!-- Silkscreen Pin Labels (G, V, R) -->
    <text x="70" y="200" fill="#f3f4f6" font-size="22" font-family="monospace" font-weight="bold" text-anchor="middle">G</text>
    <text x="100" y="200" fill="#f3f4f6" font-size="22" font-family="monospace" font-weight="bold" text-anchor="middle">V</text>
    <text x="130" y="200" fill="#f3f4f6" font-size="22" font-family="monospace" font-weight="bold" text-anchor="middle">R</text>

    <!-- Silkscreen secondary labels (-, +, S) -->
    <text x="70" y="145" fill="#f3f4f6" font-size="18" font-family="sans-serif" font-weight="bold" text-anchor="middle">-</text>
    <text x="100" y="145" fill="#f3f4f6" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">+</text>
    <text x="130" y="145" fill="#f3f4f6" font-size="16" font-family="sans-serif" font-weight="bold" text-anchor="middle">S</text>

    <!-- Vias/Pads next to labels -->
    <circle cx="70" cy="165" r="8" fill="#9ca3af" />
    <circle cx="70" cy="165" r="4" fill="#4b5563" />
    <circle cx="100" cy="165" r="8" fill="#9ca3af" />
    <circle cx="100" cy="165" r="4" fill="#4b5563" />
    <circle cx="130" cy="165" r="8" fill="#9ca3af" />
    <circle cx="130" cy="165" r="4" fill="#4b5563" />

    <!-- Vias Outline Box -->
    <rect x="58" y="152" width="84" height="26" fill="none" stroke="#f3f4f6" stroke-width="1.5" />

    <!-- Component Outlines (Left & Right) -->
    <rect x="30" y="85" width="20" height="35" fill="none" stroke="#f3f4f6" stroke-width="1.5" />
    <rect x="150" y="85" width="20" height="35" fill="none" stroke="#f3f4f6" stroke-width="1.5" />
    
    <!-- SMD Resistor (102) - Left -->
    <rect x="34" y="90" width="12" height="25" fill="#1f2937" rx="1" />
    <rect x="34" y="90" width="12" height="5" fill="#d1d5db" rx="1" />
    <rect x="34" y="110" width="12" height="5" fill="#d1d5db" rx="1" />
    <text x="40" y="105" fill="#e5e7eb" font-size="8" font-family="monospace" text-anchor="middle" transform="rotate(-90 40 105)">102</text>

    <!-- SMD LED - Right - Tied to 'powered' state -->
    <rect x="154" y="90" width="12" height="25" fill="#f8fafc" rx="1" />
    <rect x="154" y="90" width="12" height="5" fill="#d1d5db" rx="1" />
    <rect x="154" y="110" width="12" height="5" fill="#d1d5db" rx="1" />
    <circle cx="160" cy="102" r="4" fill="#10b981" />

    <!-- IR Receiver Component (VS1838B) - Top Center -->
    <!-- Base metal shield -->
    <rect x="60" y="85" width="80" height="50" fill="#4b5563" rx="3" stroke="#374151" stroke-width="2" />
    
    <!-- IR Dome - Tied to 'transmitting' state -->
    <path d="M 70 85 C 70 50, 130 50, 130 85 Z" fill="#1f2937" />
    <path d="M 80 85 C 80 60, 120 60, 120 85 Z" fill="#111827" />

    <!-- 1838 Text inside metal shield -->
    <text x="100" y="115" fill="#9ca3af" font-size="18" font-family="monospace" font-weight="bold" text-anchor="middle" letter-spacing="2">
        1838
    </text>
</svg>
