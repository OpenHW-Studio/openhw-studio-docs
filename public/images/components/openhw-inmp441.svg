<svg viewBox="0 0 60 60" width="60" height="60" style="font-family: sans-serif" xmlns="http://www.w3.org/2000/svg">
    <!-- Round mic breakout board -->
    <circle cx="30" cy="30" r="28" fill="#111155" stroke="#000033" stroke-width="2" />
    
    <!-- Microphone Hole -->
    <circle cx="30" cy="30" r="8" fill="#000" />
    <circle cx="30" cy="30" r="6" fill="#222" />
    
    <!-- Activity LED -->
    <circle cx="15" cy="15" r="3" fill="rgba(0, 255, 0, 0.5)" stroke="#004400" />
    
    <!-- Pins - Bottom edge -->
    <g transform="translate(0, 50)">
        <rect x="5" y="0" width="8" height="6" fill="#E6C200" />
        <rect x="15" y="0" width="8" height="6" fill="#E6C200" />
        <rect x="25" y="0" width="8" height="6" fill="#E6C200" />
        <rect x="35" y="0" width="8" height="6" fill="#E6C200" />
        <rect x="45" y="0" width="8" height="6" fill="#E6C200" />
        
        <text x="9" y="-2" fill="#fff" font-size="4" text-anchor="middle">VDD</text>
        <text x="19" y="-2" fill="#fff" font-size="4" text-anchor="middle">GND</text>
        <text x="29" y="-2" fill="#fff" font-size="4" text-anchor="middle">L/R</text>
        <text x="39" y="-2" fill="#fff" font-size="4" text-anchor="middle">WS</text>
        <text x="49" y="-2" fill="#fff" font-size="4" text-anchor="middle">SCK</text>
    </g>
    
    <!-- SD Pin - Top Edge -->
    <rect x="26" y="2" width="8" height="6" fill="#E6C200" />
    <text x="30" y="14" fill="#fff" font-size="4" text-anchor="middle">SD</text>
</svg>
