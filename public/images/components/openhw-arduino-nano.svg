<svg width="350" height="120" viewBox="0 0 350 120" style="font-family: sans-serif; user-select: none;" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Blue PCB -->
  <rect x="50" y="20" width="280" height="80" rx="3" fill="#034b75" />

  <!-- USB Type-C Port -->
  <rect x="25" y="45" width="25" height="30" rx="2" fill="#d4d4d4" />
  <rect x="28" y="48" width="15" height="24" rx="2" fill="#111" />
  
  <!-- Main Chip (ATmega328P) -->
  <g transform="translate(170, 60) rotate(45)">
    <rect x="-16" y="-16" width="32" height="32" rx="1" fill="#222" />
    <circle cx="-10" cy="-10" r="1.5" fill="#444" />
    <text x="0" y="2" fill="#444" font-size="6" text-anchor="middle" font-weight="bold" transform="rotate(-45)">MEGA328P</text>
  </g>
  
  <!-- Reset Button -->
  <rect x="230" y="45" width="12" height="12" rx="1" fill="#fff" />
  <circle cx="236" cy="51" r="3" fill="#ef4444" />
  <text x="228" y="55" fill="#fff" font-size="6" font-weight="bold" transform="rotate(-90, 228, 55)">RESET</text>
  
  <!-- LEDs -->
  <rect x="260" y="42" width="6" height="4" fill="#facc15" />
  <text x="270" y="46" fill="#fff" font-size="6" font-weight="bold">RX</text>

  <rect x="260" y="52" width="6" height="4" fill="#facc15" />
  <text x="270" y="56" fill="#fff" font-size="6" font-weight="bold">TX</text>
  
  <rect x="260" y="62" width="6" height="4" fill="#22c55e" />
  <text x="270" y="66" fill="#fff" font-size="6" font-weight="bold">PWR</text>
  
  <!-- ISP Header (ICSP) -->
  <circle cx="310" cy="50" r="2" fill="#111" />
  <circle cx="310" cy="55" r="2" fill="#111" />
  <circle cx="310" cy="60" r="2" fill="#111" />
  <circle cx="320" cy="50" r="2" fill="#111" />
  <circle cx="320" cy="55" r="2" fill="#111" />
  <circle cx="320" cy="60" r="2" fill="#111" />

  <!-- Logo text -->
  <text x="260" y="80" fill="#fff" font-size="10" font-weight="bold">Nano</text>
  <text x="290" y="75" fill="#fff" font-size="8">L</text>
  <circle cx="300" cy="73" r="1.5" fill="#eab308" />

  <!-- Define a pin style -->
  <defs>
    <g id="pin-top">
      <circle cx="0" cy="0" r="4.5" fill="#f8fafc" />
      <circle cx="0" cy="0" r="2.5" fill="#1e293b" />
    </g>
    <g id="pin-bot">
      <circle cx="0" cy="0" r="4.5" fill="#f8fafc" />
      <circle cx="0" cy="0" r="2.5" fill="#1e293b" />
    </g>
  </defs>

  <!-- Top Pins -->
  <g transform="translate(60, 27)">
    <use href="#pin-top" x="0" /> <text x="0" y="12" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">D12</text>
    <use href="#pin-top" x="16" /> <text x="16" y="12" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">D11</text>
    <use href="#pin-top" x="32" /> <text x="32" y="12" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">D10</text>
    <use href="#pin-top" x="48" /> <text x="48" y="12" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">D9</text>
    <use href="#pin-top" x="64" /> <text x="64" y="12" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">D8</text>
    <use href="#pin-top" x="80" /> <text x="80" y="12" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">D7</text>
    <use href="#pin-top" x="96" /> <text x="96" y="12" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">D6</text>
    <use href="#pin-top" x="112" /> <text x="112" y="12" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">D5</text>
    <use href="#pin-top" x="128" /> <text x="128" y="12" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">D4</text>
    <use href="#pin-top" x="144" /> <text x="144" y="12" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">D3</text>
    <use href="#pin-top" x="160" /> <text x="160" y="12" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">D2</text>
    <use href="#pin-top" x="176" /> <text x="176" y="12" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">GND</text>
    <use href="#pin-top" x="192" /> <text x="192" y="12" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">RST</text>
    <use href="#pin-top" x="208" /> <text x="208" y="12" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">RX0</text>
    <use href="#pin-top" x="224" /> <text x="224" y="12" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">TX1</text>
    <use href="#pin-top" x="240" /> <text x="240" y="12" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">PE1</text>
  </g>
  
  <!-- Bottom Pins -->
  <g transform="translate(60, 93)">
    <use href="#pin-bot" x="0" /> <text x="0" y="-8" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">D13</text>
    <use href="#pin-bot" x="16" /> <text x="16" y="-8" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">3V3</text>
    <use href="#pin-bot" x="32" /> <text x="32" y="-8" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">AREF</text>
    <use href="#pin-bot" x="48" /> <text x="48" y="-8" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">A0</text>
    <use href="#pin-bot" x="64" /> <text x="64" y="-8" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">A1</text>
    <use href="#pin-bot" x="80" /> <text x="80" y="-8" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">A2</text>
    <use href="#pin-bot" x="96" /> <text x="96" y="-8" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">A3</text>
    <use href="#pin-bot" x="112" /> <text x="112" y="-8" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">A4</text>
    <use href="#pin-bot" x="128" /> <text x="128" y="-8" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">A5</text>
    <use href="#pin-bot" x="144" /> <text x="144" y="-8" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">A6</text>
    <use href="#pin-bot" x="160" /> <text x="160" y="-8" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">A7</text>
    <use href="#pin-bot" x="176" /> <text x="176" y="-8" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">+5V</text>
    <use href="#pin-bot" x="192" /> <text x="192" y="-8" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">RST</text>
    <use href="#pin-bot" x="208" /> <text x="208" y="-8" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">GND</text>
    <use href="#pin-bot" x="224" /> <text x="224" y="-8" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">VIN</text>
    <use href="#pin-bot" x="240" /> <text x="240" y="-8" fill="#fff" font-size="6" font-weight="bold" text-anchor="middle">PE0</text>
  </g>
</svg>
