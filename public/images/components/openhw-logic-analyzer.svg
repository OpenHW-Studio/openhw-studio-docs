<svg width="150" height="90" viewBox="0 0 150 90" xmlns="http://www.w3.org/2000/svg" style="font-family: sans-serif;">
    <rect width="150" height="90" fill="#2c3e50" rx="9" />
    <rect x="6" y="6" width="138" height="45" fill="#34495e" rx="3" />

    <text x="75" y="30" font-size="12" fill="white" font-weight="bold" text-anchor="middle">8-CH LOGIC</text>
    <text x="75" y="42" font-size="9" fill="#bdc3c7" text-anchor="middle">ANALYZER</text>

    <!-- Activity LED -->
    <circle cx="15" cy="30" r="4.5" fill="#7f8c8d" />

    <!-- Pins (15px pitch) -->
    <circle cx="15" cy="90" r="4.5" fill="#34495e" />
    <text x="15" y="75" font-size="7.5" fill="white" text-anchor="middle">GND</text>

    <g><circle cx="30" cy="90" r="4.5" fill="#f1c40f" /><text x="30" y="75" font-size="7.5" fill="white" text-anchor="middle">D0</text></g>
    <g><circle cx="45" cy="90" r="4.5" fill="#f1c40f" /><text x="45" y="75" font-size="7.5" fill="white" text-anchor="middle">D1</text></g>
    <g><circle cx="60" cy="90" r="4.5" fill="#f1c40f" /><text x="60" y="75" font-size="7.5" fill="white" text-anchor="middle">D2</text></g>
    <g><circle cx="75" cy="90" r="4.5" fill="#f1c40f" /><text x="75" y="75" font-size="7.5" fill="white" text-anchor="middle">D3</text></g>
    <g><circle cx="90" cy="90" r="4.5" fill="#f1c40f" /><text x="90" y="75" font-size="7.5" fill="white" text-anchor="middle">D4</text></g>
    <g><circle cx="105" cy="90" r="4.5" fill="#f1c40f" /><text x="105" y="75" font-size="7.5" fill="white" text-anchor="middle">D5</text></g>
    <g><circle cx="120" cy="90" r="4.5" fill="#f1c40f" /><text x="120" y="75" font-size="7.5" fill="white" text-anchor="middle">D6</text></g>
    <g><circle cx="135" cy="90" r="4.5" fill="#f1c40f" /><text x="135" y="75" font-size="7.5" fill="white" text-anchor="middle">D7</text></g>
</svg>
