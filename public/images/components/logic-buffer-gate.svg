<svg width="60" height="30" viewBox="0 0 60 30" style="pointer-events: none;" xmlns="http://www.w3.org/2000/svg">
    <!-- Input wire -->
    <line x1="0" y1="15" x2="15" y2="15" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" />

    <!-- Triangle body -->
    <defs>
        <linearGradient id="bufferGateFill" x1="15" y1="5" x2="45" y2="15" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#c084fc" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05" />
        </linearGradient>
    </defs>
    <polygon
        points="15,5 45,15 15,25"
        fill="url(#bufferGateFill)"
        stroke="#a855f7"
        stroke-width="2"
        stroke-linejoin="round"
        stroke-linecap="round"
    />

    <!-- Output wire -->
    <line x1="45" y1="15" x2="60" y2="15" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" />
</svg>
