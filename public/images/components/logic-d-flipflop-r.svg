<svg width="90" height="90" viewBox="0 0 90 90" style="pointer-events: none;" xmlns="http://www.w3.org/2000/svg">
    <!-- Input wires — D (top-left) and CLK (bottom-left) -->
    <line x1="0" y1="30" x2="18" y2="30" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="60" x2="18" y2="60" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" />

    <!-- Reset wire (bottom-center) -->
    <line x1="45" y1="90" x2="45" y2="80" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" />

    <!-- Rectangular body -->
    <defs>
        <linearGradient id="dffrFill" x1="18" y1="10" x2="72" y2="80" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#c084fc" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05" />
        </linearGradient>
    </defs>
    <rect
        x="18" y="10" width="54" height="70" rx="4"
        fill="url(#dffrFill)"
        stroke="#a855f7"
        stroke-width="2"
    />

    <!-- Labels inside -->
    <text x="24" y="34" fill="#a855f7" font-size="12" font-family="monospace" font-weight="bold">D</text>

    <!-- Clock triangle -->
    <polygon points="18,54 28,60 18,66" fill="none" stroke="#a855f7" stroke-width="2" stroke-linejoin="round" />

    <!-- Reset label -->
    <text x="41" y="76" fill="#a855f7" font-size="12" font-family="monospace" font-weight="bold">R</text>

    <!-- Q label -->
    <text x="68" y="34" fill="#a855f7" font-size="12" font-family="monospace" font-weight="bold" text-anchor="end">Q</text>

    <!-- Qbar label — Q with overline -->
    <text x="68" y="64" fill="#a855f7" font-size="12" font-family="monospace" font-weight="bold" text-anchor="end">Q</text>
    <line x1="59" y1="54" x2="69" y2="54" stroke="#a855f7" stroke-width="2" />

    <!-- Output wires — Q and Qbar -->
    <line x1="72" y1="30" x2="90" y2="30" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" />
    <line x1="72" y1="60" x2="90" y2="60" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" />
</svg>
