<svg width="100" height="120" viewBox="0 0 100 120" style="font-family: sans-serif; user-select: none;" xmlns="http://www.w3.org/2000/svg">
  <!-- Red PCB -->
  <rect x="5" y="10" width="90" height="100" rx="4" fill="#991b1b" />

  <!-- SD Card Holder (Metal) -->
  <rect x="10" y="25" width="60" height="85" rx="2" fill="#d4d4d4" />
  
  <!-- Black SD Card Inserted -->
  <path d="M 22 10 L 68 10 C 70 10 72 12 72 14 L 72 25 L 18 25 L 18 14 C 18 12 20 10 22 10 Z" fill="#111" />
  <!-- Card Grip -->
  <rect x="25" y="15" width="40" height="4" rx="2" fill="#222" />

  <!-- Cutouts on Metal Holder -->
  <rect x="35" y="45" width="12" height="6" rx="1" fill="#222" />
  <rect x="50" y="45" width="12" height="6" rx="1" fill="#222" />
  <rect x="15" y="38" width="6" height="24" rx="1" fill="#222" />
  <circle cx="18" cy="58" r="3" fill="#222" />
  
  <rect x="40" y="70" width="2" height="30" fill="#222" />
  <rect x="44" y="70" width="2" height="30" fill="#222" />
  <rect x="60" y="70" width="2" height="30" fill="#222" />
  <rect x="64" y="70" width="2" height="30" fill="#222" />

  <circle cx="40" cy="110" r="2.5" fill="#111" />

  <!-- Header Pins on Right -->
  <!-- CD -->
  <text x="80" y="28" fill="#fff" font-size="10" font-weight="bold" text-anchor="end">CD</text>
  <circle cx="85" cy="25" r="4.5" fill="#fef08a" />
  <circle cx="85" cy="25" r="2.5" fill="#fff" />
  
  <!-- DO -->
  <text x="80" y="43" fill="#fff" font-size="10" font-weight="bold" text-anchor="end">DO</text>
  <circle cx="85" cy="40" r="4.5" fill="#fef08a" />
  <circle cx="85" cy="40" r="2.5" fill="#fff" />
  
  <!-- GND -->
  <text x="80" y="58" fill="#fff" font-size="10" font-weight="bold" text-anchor="end">GND</text>
  <circle cx="85" cy="55" r="4.5" fill="#fef08a" />
  <circle cx="85" cy="55" r="2.5" fill="#fff" />
  
  <!-- SCK -->
  <text x="80" y="73" fill="#fff" font-size="10" font-weight="bold" text-anchor="end">SCK</text>
  <circle cx="85" cy="70" r="4.5" fill="#fef08a" />
  <circle cx="85" cy="70" r="2.5" fill="#fff" />
  
  <!-- VCC -->
  <text x="80" y="88" fill="#fff" font-size="10" font-weight="bold" text-anchor="end">VCC</text>
  <circle cx="85" cy="85" r="4.5" fill="#fef08a" />
  <circle cx="85" cy="85" r="2.5" fill="#fff" />
  
  <!-- DI -->
  <text x="80" y="103" fill="#fff" font-size="10" font-weight="bold" text-anchor="end">DI</text>
  <circle cx="85" cy="100" r="4.5" fill="#fef08a" />
  <circle cx="85" cy="100" r="2.5" fill="#fff" />
  
  <!-- CS -->
  <text x="80" y="118" fill="#fff" font-size="10" font-weight="bold" text-anchor="end">CS</text>
  <circle cx="85" cy="115" r="4.5" fill="#fef08a" />
  <circle cx="85" cy="115" r="2.5" fill="#fff" />
</svg>
