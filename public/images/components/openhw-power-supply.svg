<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="psuBody" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#424242" />
            <stop offset="100%" stop-color="#212121" />
        </linearGradient>
        <linearGradient id="psuScreen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#111" />
            <stop offset="100%" stop-color="#000" />
        </linearGradient>
    </defs>
    
    <!-- Main Metallic Case (Width 55 to leave room for terminal pins) -->
    <rect x="0" y="0" width="55" height="60" rx="4" fill="url(#psuBody)" stroke="#616161" stroke-width="1" />
    
    <!-- Top Grille Details -->
    <line x1="5" y1="5" x2="50" y2="5" stroke="#111" stroke-width="1" />
    <line x1="5" y1="8" x2="50" y2="8" stroke="#111" stroke-width="1" />
    <line x1="5" y1="11" x2="50" y2="11" stroke="#111" stroke-width="1" />

    <!-- Digital Screen Recess -->
    <rect x="5" y="16" width="45" height="20" rx="2" fill="url(#psuScreen)" stroke="#333" stroke-width="1" />
    
    <!-- Glowing Green Voltage Text -->
    <text x="27.5" y="31" fill="#00FF00" font-size="12" font-family="monospace" font-weight="bold" text-anchor="middle" style="text-shadow: 0px 0px 4px #00FF00;">5.0V</text>

    <!-- Status LED -->
    <circle cx="10" cy="48" r="2" fill="#00FF00" style="filter: drop-shadow(0px 0px 2px #00FF00);" />
    <text x="14" y="51" fill="#BDBDBD" font-size="6" font-family="sans-serif">ON</text>

    <!-- Terminals extending to x=60 -->
    <!-- Red Terminal (Power) at y=16.5 -->
    <rect x="55" y="14" width="3" height="5" fill="#B71C1C" />
    <path d="M 55 16.5 L 60 16.5" stroke="#E53935" stroke-width="3" stroke-linecap="round" />
    
    <!-- Black Terminal (Ground) at y=46.5 -->
    <rect x="55" y="44" width="3" height="5" fill="#212121" />
    <path d="M 55 46.5 L 60 46.5" stroke="#424242" stroke-width="3" stroke-linecap="round" />
</svg>
