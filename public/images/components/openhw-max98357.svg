<svg width="75" height="105" viewBox="0 0 75 105" xmlns="http://www.w3.org/2000/svg" style="font-family: sans-serif;">
  <!-- Board Background -->
  <rect x="0" y="0" width="75" height="105" rx="4" fill="#6B0015" stroke="#42000B" stroke-width="2" />
  
  <!-- Chip -->
  <rect x="25" y="42.5" width="20" height="20" rx="2" fill="#222" />
  <text x="35" y="54" fill="#fff" font-size="4" text-anchor="middle" font-family="monospace">MAX98357</text>
  
  <!-- Input Pins - Left edge -->
  <g>
    <!-- Pins at 7.5, 22.5, 37.5, 52.5, 67.5, 82.5, 97.5 -->
    <rect x="5" y="5.5" width="10" height="4" fill="#E6C200" />
    <circle cx="7.5" cy="7.5" r="1.5" fill="#2C3E50" />
    <text x="17" y="8.5" fill="#fff" font-size="5" alignment-baseline="middle">LRC</text>

    <rect x="5" y="20.5" width="10" height="4" fill="#E6C200" />
    <circle cx="7.5" cy="22.5" r="1.5" fill="#2C3E50" />
    <text x="17" y="23.5" fill="#fff" font-size="5" alignment-baseline="middle">BCLK</text>

    <rect x="5" y="35.5" width="10" height="4" fill="#E6C200" />
    <circle cx="7.5" cy="37.5" r="1.5" fill="#2C3E50" />
    <text x="17" y="38.5" fill="#fff" font-size="5" alignment-baseline="middle">DIN</text>

    <rect x="5" y="50.5" width="10" height="4" fill="#E6C200" />
    <circle cx="7.5" cy="52.5" r="1.5" fill="#2C3E50" />
    <text x="17" y="53.5" fill="#fff" font-size="5" alignment-baseline="middle">GAIN</text>

    <rect x="5" y="65.5" width="10" height="4" fill="#E6C200" />
    <circle cx="7.5" cy="67.5" r="1.5" fill="#2C3E50" />
    <text x="17" y="68.5" fill="#fff" font-size="5" alignment-baseline="middle">SD</text>

    <rect x="5" y="80.5" width="10" height="4" fill="#E6C200" />
    <circle cx="7.5" cy="82.5" r="1.5" fill="#2C3E50" />
    <text x="17" y="83.5" fill="#fff" font-size="5" alignment-baseline="middle">GND</text>

    <rect x="5" y="95.5" width="10" height="4" fill="#E6C200" />
    <circle cx="7.5" cy="97.5" r="1.5" fill="#2C3E50" />
    <text x="17" y="98.5" fill="#fff" font-size="5" alignment-baseline="middle">VIN</text>
  </g>

  <!-- Output Terminal Block - Right edge -->
  <rect x="55" y="25" width="20" height="55" fill="#006600" />
  <circle cx="67.5" cy="37.5" r="3" fill="#aaa" />
  <circle cx="67.5" cy="67.5" r="3" fill="#aaa" />
  <text x="52" y="38.5" fill="#fff" font-size="5" text-anchor="end" alignment-baseline="middle">OUT+</text>
  <text x="52" y="68.5" fill="#fff" font-size="5" text-anchor="end" alignment-baseline="middle">OUT-</text>
</svg>
