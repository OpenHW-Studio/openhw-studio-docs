<svg width="120" height="75" viewBox="0 0 120 75" style="display: block;" xmlns="http://www.w3.org/2000/svg">
    <!-- PCB Base -->
    <rect x="0" y="0" width="120" height="75" rx="3" fill="#b91c1c" stroke="#991b1b" stroke-width="1" />
    
    <!-- Silk Screen Borders / Details -->
    <rect x="2" y="2" width="116" height="71" rx="2" fill="none" stroke="#fca5a5" stroke-width="0.5" opacity="0.3" />
    <circle cx="100" cy="47.5" r="0.8" fill="#fef08a" />
    <circle cx="104" cy="47.5" r="0.8" fill="#fef08a" />
    <circle cx="100" cy="51.5" r="0.8" fill="#fef08a" />
    <circle cx="104" cy="51.5" r="0.8" fill="#fef08a" />

    <!-- Main Ceramic Capacitor -->
    <g transform="translate(100, 22)">
        <rect x="-4" y="0" width="8" height="12" rx="1" fill="#b45309" />
        <rect x="-4" y="0" width="8" height="2" rx="0.5" fill="#9ca3af" />
        <rect x="-4" y="10" width="8" height="2" rx="0.5" fill="#9ca3af" />
    </g>

    <!-- Sense Resistors (R100) -->
    <g transform="translate(70, 25)">
        <rect x="-5" y="-2.5" width="10" height="5" fill="#111827" />
        <rect x="-5" y="-2.5" width="1.5" height="5" fill="#9ca3af" />
        <rect x="3.5" y="-2.5" width="1.5" height="5" fill="#9ca3af" />
        <text x="0" y="1.5" fill="#fff" font-size="2.5" font-weight="bold" text-anchor="middle">R100</text>
    </g>
    <g transform="translate(70, 50)">
        <rect x="-5" y="-2.5" width="10" height="5" fill="#111827" />
        <rect x="-5" y="-2.5" width="1.5" height="5" fill="#9ca3af" />
        <rect x="3.5" y="-2.5" width="1.5" height="5" fill="#9ca3af" />
        <text x="0" y="1.5" fill="#fff" font-size="2.5" font-weight="bold" text-anchor="middle">R100</text>
    </g>

    <!-- Trimpot (Potentiometer) -->
    <g transform="translate(90, 37.5)">
        <!-- Metal Base -->
        <rect x="-6" y="-7" width="12" height="14" rx="1" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.5" />
        <!-- Circle rotor -->
        <circle cx="0" cy="0" r="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
        <circle cx="0" cy="0" r="4" fill="#e2e8f0" />
        <!-- Cross slot -->
        <path d="M -3 0 L 3 0 M 0 -3 L 0 3" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
        <circle cx="-2.5" cy="-2.5" r="0.8" fill="#94a3b8" />
    </g>

    <!-- A4988 IC -->
    <g transform="translate(42.5, 37.5)">
        <rect x="-11" y="-11" width="22" height="22" rx="1.5" fill="#111827" stroke="#000" stroke-width="0.5" />
        <circle cx="-8" cy="-8" r="1.5" fill="#374151" />
        <text x="0" y="2" fill="#4b5563" font-size="4.5" font-weight="bold" text-anchor="middle" transform="rotate(-90)">A4988</text>
        <!-- Silver IC Pads -->
        <path d="M -9 -11 v 1 m 3 -1 v 1 m 3 -1 v 1 m 3 -1 v 1 m 3 -1 v 1 m 3 -1 v 1" stroke="#9ca3af" stroke-width="1.2" />
        <path d="M -9 10 v 1 m 3 -1 v 1 m 3 -1 v 1 m 3 -1 v 1 m 3 -1 v 1 m 3 -1 v 1" stroke="#9ca3af" stroke-width="1.2" />
        <path d="M -11 -9 h 1 m -1 3 h 1 m -1 3 h 1 m -1 3 h 1 m -1 3 h 1 m -1 3 h 1" stroke="#9ca3af" stroke-width="1.2" />
        <path d="M 10 -9 h 1 m -1 3 h 1 m -1 3 h 1 m -1 3 h 1 m -1 3 h 1 m -1 3 h 1" stroke="#9ca3af" stroke-width="1.2" />
    </g>

    <!-- Header Pins (Top Row) -->
    <g>
        <circle cx="7.5" cy="7.5" r="4" fill="#ca8a04" /><circle cx="7.5" cy="7.5" r="3" fill="#fef08a" /><circle cx="7.5" cy="7.5" r="1.8" fill="#111" />
        <circle cx="22.5" cy="7.5" r="4" fill="#ca8a04" /><circle cx="22.5" cy="7.5" r="3" fill="#fef08a" /><circle cx="22.5" cy="7.5" r="1.8" fill="#111" />
        <circle cx="37.5" cy="7.5" r="4" fill="#ca8a04" /><circle cx="37.5" cy="7.5" r="3" fill="#fef08a" /><circle cx="37.5" cy="7.5" r="1.8" fill="#111" />
        <circle cx="52.5" cy="7.5" r="4" fill="#ca8a04" /><circle cx="52.5" cy="7.5" r="3" fill="#fef08a" /><circle cx="52.5" cy="7.5" r="1.8" fill="#111" />
        <circle cx="67.5" cy="7.5" r="4" fill="#ca8a04" /><circle cx="67.5" cy="7.5" r="3" fill="#fef08a" /><circle cx="67.5" cy="7.5" r="1.8" fill="#111" />
        <circle cx="82.5" cy="7.5" r="4" fill="#ca8a04" /><circle cx="82.5" cy="7.5" r="3" fill="#fef08a" /><circle cx="82.5" cy="7.5" r="1.8" fill="#111" />
        <circle cx="97.5" cy="7.5" r="4" fill="#ca8a04" /><circle cx="97.5" cy="7.5" r="3" fill="#fef08a" /><circle cx="97.5" cy="7.5" r="1.8" fill="#111" />
        <circle cx="112.5" cy="7.5" r="4" fill="#ca8a04" /><circle cx="112.5" cy="7.5" r="3" fill="#fef08a" /><circle cx="112.5" cy="7.5" r="1.8" fill="#111" />
    </g>

    <!-- Header Pins (Bottom Row) -->
    <g>
        <circle cx="7.5" cy="67.5" r="4" fill="#ca8a04" /><circle cx="7.5" cy="67.5" r="3" fill="#fef08a" /><circle cx="7.5" cy="67.5" r="1.8" fill="#111" />
        <circle cx="22.5" cy="67.5" r="4" fill="#ca8a04" /><circle cx="22.5" cy="67.5" r="3" fill="#fef08a" /><circle cx="22.5" cy="67.5" r="1.8" fill="#111" />
        <circle cx="37.5" cy="67.5" r="4" fill="#ca8a04" /><circle cx="37.5" cy="67.5" r="3" fill="#fef08a" /><circle cx="37.5" cy="67.5" r="1.8" fill="#111" />
        <circle cx="52.5" cy="67.5" r="4" fill="#ca8a04" /><circle cx="52.5" cy="67.5" r="3" fill="#fef08a" /><circle cx="52.5" cy="67.5" r="1.8" fill="#111" />
        <circle cx="67.5" cy="67.5" r="4" fill="#ca8a04" /><circle cx="67.5" cy="67.5" r="3" fill="#fef08a" /><circle cx="67.5" cy="67.5" r="1.8" fill="#111" />
        <circle cx="82.5" cy="67.5" r="4" fill="#ca8a04" /><circle cx="82.5" cy="67.5" r="3" fill="#fef08a" /><circle cx="82.5" cy="67.5" r="1.8" fill="#111" />
        <circle cx="97.5" cy="67.5" r="4" fill="#ca8a04" /><circle cx="97.5" cy="67.5" r="3" fill="#fef08a" /><circle cx="97.5" cy="67.5" r="1.8" fill="#111" />
        <circle cx="112.5" cy="67.5" r="4" fill="#ca8a04" /><circle cx="112.5" cy="67.5" r="3" fill="#fef08a" /><circle cx="112.5" cy="67.5" r="1.8" fill="#111" />
    </g>

    <!-- Top Labels -->
    <text x="7.5" y="18" fill="white" font-size="4.5" font-weight="bold" text-anchor="middle">DIR</text>
    <text x="22.5" y="18" fill="white" font-size="4.5" font-weight="bold" text-anchor="middle">STEP</text>
    <text x="37.5" y="18" fill="white" font-size="4.5" font-weight="bold" text-anchor="middle">SLP</text>
    <text x="52.5" y="18" fill="white" font-size="4.5" font-weight="bold" text-anchor="middle">RST</text>
    <text x="67.5" y="18" fill="white" font-size="4.5" font-weight="bold" text-anchor="middle">MS3</text>
    <text x="82.5" y="18" fill="white" font-size="4.5" font-weight="bold" text-anchor="middle">MS2</text>
    <text x="97.5" y="18" fill="white" font-size="4.5" font-weight="bold" text-anchor="middle">MS1</text>
    <text x="112.5" y="18" fill="white" font-size="4.5" font-weight="bold" text-anchor="middle">EN</text>

    <!-- Bottom Labels -->
    <text x="7.5" y="59" fill="white" font-size="4.5" font-weight="bold" text-anchor="middle">GND</text>
    <text x="22.5" y="59" fill="white" font-size="4.5" font-weight="bold" text-anchor="middle">VDD</text>
    <text x="37.5" y="59" fill="white" font-size="4.5" font-weight="bold" text-anchor="middle">1B</text>
    <text x="52.5" y="59" fill="white" font-size="4.5" font-weight="bold" text-anchor="middle">1A</text>
    <text x="67.5" y="59" fill="white" font-size="4.5" font-weight="bold" text-anchor="middle">2A</text>
    <text x="82.5" y="59" fill="white" font-size="4.5" font-weight="bold" text-anchor="middle">2B</text>
    <text x="97.5" y="59" fill="white" font-size="4.5" font-weight="bold" text-anchor="middle">GND</text>
    <text x="112.5" y="59" fill="white" font-size="4.5" font-weight="bold" text-anchor="middle">VMOT</text>
</svg>
