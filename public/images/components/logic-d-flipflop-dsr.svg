<svg width="120" height="90" viewBox="0 0 120 90" style="pointer-events: none;" xmlns="http://www.w3.org/2000/svg">
    <!-- Input wires — D (top-left) and CLK (bottom-left) -->
    <line x1="0" y1="30" x2="20" y2="30" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="60" x2="20" y2="60" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" />

    <!-- Set wire (top-center) -->
    <line x1="60" y1="0" x2="60" y2="10" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" />

    <!-- Reset wire (bottom-center) -->
    <line x1="60" y1="90" x2="60" y2="80" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" />

    <!-- Rectangular body -->
    <defs>
        <linearGradient id="dffdsrFill" x1="20" y1="10" x2="100" y2="80" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#c084fc" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05" />
        </linearGradient>
    </defs>
    <rect
        x="20" y="10" width="80" height="70" rx="4"
        fill="url(#dffdsrFill)"
        stroke="#a855f7"
        stroke-width="2"
    />

    <!-- Labels inside -->
    <text x="30" y="34" fill="#a855f7" font-size="12" font-family="monospace" font-weight="bold">D</text>

    <!-- Clock triangle -->
    <polygon points="20,54 30,60 20,66" fill="none" stroke="#a855f7" stroke-width="2" stroke-linejoin="round" />

    <!-- Set label -->
    <text x="56" y="24" fill="#a855f7" font-size="12" font-family="monospace" font-weight="bold">S</text>

    <!-- Reset label -->
    <text x="56" y="74" fill="#a855f7" font-size="12" font-family="monospace" font-weight="bold">R</text>

    <!-- Q label -->
    <text x="90" y="34" fill="#a855f7" font-size="12" font-family="monospace" font-weight="bold" text-anchor="end">Q</text>

    <!-- Qbar label — Q with overline -->
    <text x="90" y="64" fill="#a855f7" font-size="12" font-family="monospace" font-weight="bold" text-anchor="end">Q</text>
    <line x1="81" y1="54" x2="91" y2="54" stroke="#a855f7" stroke-width="2" />

    <!-- Output wires — Q and Qbar -->
    <line x1="100" y1="30" x2="120" y2="30" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" />
    <line x1="100" y1="60" x2="120" y2="60" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" />
</svg>
