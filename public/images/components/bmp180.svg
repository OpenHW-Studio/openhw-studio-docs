<svg width="216" height="150" viewBox="0 0 72 50">
      <!-- Red PCB -->
      <rect x="1" y="1" width="70" height="48" rx="3" ry="3" fill="#B32424" stroke="#801919" stroke-width="0.5"/>
      <!-- Mounting holes -->
      <circle cx="8"  cy="8" r="3.5" fill="#1e293b"/>
      <circle cx="8"  cy="8" r="2.5" fill="#e2e8f0"/>
      <circle cx="64" cy="8" r="3.5" fill="#1e293b"/>
      <circle cx="64" cy="8" r="2.5" fill="#e2e8f0"/>
      <!-- Trace routing -->
      <path d="M 10 20 L 10 40 M 25 20 L 25 40 M 40 20 L 40 40 M 55 20 L 55 40"
            fill="none" stroke="#60a5fa" stroke-width="0.5" opacity="0.4"/>
      <!-- Voltage regulator -->
      <rect x="10" y="15" width="6" height="6" rx="0.5" fill="#1f2937"/>
      <rect x="9.5" y="16"  width="1" height="1" fill="#94a3b8"/>
      <rect x="9.5" y="19"  width="1" height="1" fill="#94a3b8"/>
      <rect x="15.5" y="17.5" width="1" height="1" fill="#94a3b8"/>
      <!-- SMD passives cluster 1 -->
      <rect x="20" y="15" width="2.5" height="4" fill="#94a3b8" rx="0.2"/>
      <rect x="20" y="15" width="2.5" height="1" fill="#475569" rx="0.2"/>
      <rect x="20" y="18" width="2.5" height="1" fill="#475569" rx="0.2"/>
      <rect x="24" y="15" width="2.5" height="4" fill="#94a3b8" rx="0.2"/>
      <rect x="24" y="15" width="2.5" height="1" fill="#475569" rx="0.2"/>
      <rect x="24" y="18" width="2.5" height="1" fill="#475569" rx="0.2"/>
      <!-- SMD passives cluster 2 -->
      <rect x="42" y="15" width="2.5" height="4" fill="#94a3b8" rx="0.2"/>
      <rect x="42" y="15" width="2.5" height="1" fill="#475569" rx="0.2"/>
      <rect x="42" y="18" width="2.5" height="1" fill="#475569" rx="0.2"/>
      <rect x="46" y="15" width="2.5" height="4" fill="#94a3b8" rx="0.2"/>
      <rect x="46" y="15" width="2.5" height="1" fill="#475569" rx="0.2"/>
      <rect x="46" y="18" width="2.5" height="1" fill="#475569" rx="0.2"/>
      <!-- BMP180 sensor package -->
      <rect x="52" y="17" width="12" height="12" rx="1" ry="1" fill="#cbd5e1" stroke="#64748b" stroke-width="0.5"/>
      <rect x="53" y="18" width="10" height="10" rx="0.5" ry="0.5" fill="#e2e8f0"/>
      <circle cx="55.5" cy="25.5" r="1.5" fill="#020617"/>
      <rect x="58" y="20" width="3" height="3" fill="#475569"/>
      <rect x="58.5" y="20.5" width="2" height="2" fill="#1e293b"/>
      <text x="58" y="19.5" font-family="sans-serif" font-size="2.2" fill="#64748b" text-anchor="middle">BMP180</text>
      <!-- Pin labels -->
      <text x="10" y="44" font-family="monospace" font-size="4.5" font-weight="bold" fill="#f8fafc" text-anchor="middle">VIN</text>
      <text x="25" y="44" font-family="monospace" font-size="4.5" font-weight="bold" fill="#f8fafc" text-anchor="middle">GND</text>
      <text x="40" y="44" font-family="monospace" font-size="4.5" font-weight="bold" fill="#f8fafc" text-anchor="middle">SCL</text>
      <text x="55" y="44" font-family="monospace" font-size="4.5" font-weight="bold" fill="#f8fafc" text-anchor="middle">SDA</text>
      <!-- Header lines -->
      <path d="M 5 46 L 60 46 M 5 49 L 60 49" fill="none" stroke="#f8fafc" stroke-width="0.5"/>
      <!-- Pin pads -->
      <circle cx="10" cy="48" r="1.5" fill="#FFD700" stroke="#B8860B" stroke-width="0.3"/>
      <circle cx="25" cy="48" r="1.5" fill="#FFD700" stroke="#B8860B" stroke-width="0.3"/>
      <circle cx="40" cy="48" r="1.5" fill="#FFD700" stroke="#B8860B" stroke-width="0.3"/>
      <circle cx="55" cy="48" r="1.5" fill="#FFD700" stroke="#B8860B" stroke-width="0.3"/>
    </svg>