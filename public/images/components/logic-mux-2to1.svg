<svg width="90" height="75" viewBox="0 0 90 75" style="pointer-events: none;" xmlns="http://www.w3.org/2000/svg">
    <!-- Input wires — D0, D1 at 15 and 45 -->
    <line x1="0" y1="15" x2="24" y2="15" stroke="#1e1e1e" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="45" x2="24" y2="45" stroke="#1e1e1e" stroke-width="3" stroke-linecap="round" />

    <!-- Select wire — bottom center at 45, 75 -->
    <line x1="45" y1="75" x2="45" y2="55" stroke="#1e1e1e" stroke-width="3" stroke-linecap="round" />

    <!-- Trapezoid body -->
    <defs>
        <linearGradient id="muxFill" x1="24" y1="0" x2="66" y2="60" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#c084fc" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05" />
        </linearGradient>
    </defs>
    <polygon
        points="24,0 66,10 66,50 24,60"
        fill="url(#muxFill)"
        stroke="#a855f7"
        stroke-width="3"
        stroke-linejoin="round"
        stroke-linecap="round"
    />

    <!-- Labels inside -->
    <text x="32" y="19" fill="#a855f7" font-size="10" font-family="monospace" font-weight="bold">0</text>
    <text x="32" y="49" fill="#a855f7" font-size="10" font-family="monospace" font-weight="bold">1</text>

    <!-- Output wire at 30 -->
    <line x1="66" y1="30" x2="90" y2="30" stroke="#1e1e1e" stroke-width="3" stroke-linecap="round" />
</svg>
