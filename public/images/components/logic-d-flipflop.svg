<svg width="105" height="90" viewBox="0 0 105 90" style="pointer-events: none;" xmlns="http://www.w3.org/2000/svg">
    <!-- Input wires — D and CLK -->
    <line x1="0" y1="30" x2="20" y2="30" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="60" x2="20" y2="60" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" />

    <!-- Rectangular body -->
    <defs>
        <linearGradient id="dffFill" x1="20" y1="10" x2="85" y2="80" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#c084fc" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05" />
        </linearGradient>
    </defs>
    <rect
        x="20" y="10" width="65" height="70" rx="4"
        fill="url(#dffFill)"
        stroke="#a855f7"
        stroke-width="2"
    />

    <!-- D label -->
    <text x="30" y="34" fill="#a855f7" font-size="12" font-family="monospace" font-weight="bold">D</text>

    <!-- Clock triangle -->
    <polygon points="20,54 30,60 20,66" fill="none" stroke="#a855f7" stroke-width="2" stroke-linejoin="round" />

    <!-- Large D in center -->
    <text x="52.5" y="55" fill="#a855f7" font-size="24" font-family="monospace" font-weight="bold" opacity="0.4" text-anchor="middle">D</text>

    <!-- Q label -->
    <text x="75" y="34" fill="#a855f7" font-size="12" font-family="monospace" font-weight="bold" text-anchor="end">Q</text>

    <!-- Qbar label — Q with overline -->
    <text x="75" y="64" fill="#a855f7" font-size="12" font-family="monospace" font-weight="bold" text-anchor="end">Q</text>
    <line x1="66" y1="54" x2="76" y2="54" stroke="#a855f7" stroke-width="2" />

    <!-- Output wires — Q and Qbar -->
    <line x1="85" y1="30" x2="105" y2="30" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" />
    <line x1="85" y1="60" x2="105" y2="60" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" />
</svg>
