<svg width="165" height="135" viewBox="0 0 165 135" xmlns="http://www.w3.org/2000/svg" style="font-family: sans-serif;">
  <!-- PCB Base -->
  <rect x="0" y="0" width="165" height="135" rx="4" fill="#0d47a1" />
  <rect x="0" y="0" width="165" height="135" rx="4" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />

  <!-- Mounting Holes -->
  <circle cx="10" cy="10" r="3.5" fill="#0f172a" stroke="#d1d5db" stroke-width="1"/>
  <circle cx="155" cy="10" r="3.5" fill="#0f172a" stroke="#d1d5db" stroke-width="1"/>
  <circle cx="10" cy="125" r="3.5" fill="#0f172a" stroke="#d1d5db" stroke-width="1"/>
  <circle cx="155" cy="125" r="3.5" fill="#0f172a" stroke="#d1d5db" stroke-width="1"/>

  <!-- Left Through-Hole Pads -->
  <g stroke="#fbbf24" stroke-width="1.2" fill="#0f172a">
      <circle cx="15" cy="15" r="2.5" />
      <circle cx="15" cy="30" r="2.5" />
      <circle cx="15" cy="45" r="2.5" />
      <circle cx="15" cy="60" r="2.5" />
      <circle cx="15" cy="75" r="2.5" />
      <circle cx="15" cy="90" r="2.5" />
      <circle cx="15" cy="105" r="2.5" />
      <circle cx="15" cy="120" r="2.5" />
  </g>

  <!-- Left Silkscreen Pin Labels -->
  <g fill="#ffffff" font-size="7.5" font-weight="bold" text-anchor="start">
      <text x="23" y="17.5">3V3</text>
      <text x="23" y="32.5">RST</text>
      <text x="23" y="47.5">GND</text>
      <text x="23" y="62.5">IRQ</text>
      <text x="23" y="77.5">MISO</text>
      <text x="23" y="92.5">MOSI</text>
      <text x="23" y="107.5">SCK</text>
      <text x="23" y="122.5">SDA</text>
  </g>

  <!-- RFID Antenna Traces -->
  <g fill="none" stroke="#2a64b5" stroke-width="1.5">
      <rect x="75" y="23.5" width="74" height="88" rx="8" />
      <rect x="79" y="27.5" width="66" height="80" rx="6" />
      <rect x="83" y="31.5" width="58" height="72" rx="4" />
      <rect x="87" y="35.5" width="50" height="64" rx="2" />
      <rect x="91" y="39.5" width="42" height="56" rx="1" />
  </g>

  <!-- Silkscreen Text -->
  <text x="159" y="67.5" transform="rotate(-90 159 67.5)" text-anchor="middle" font-size="8" fill="#ffffff" font-weight="bold">RFID-RC522</text>
  <text x="112" y="16" text-anchor="middle" font-size="6" fill="#ffffff">13.56 MHz</text>

  <!-- MFRC522 Chip -->
  <rect x="40" y="53.5" width="28" height="28" rx="1.5" fill="#1e1e1e" />
  <!-- Chip Pins -->
  <path d="M 39 57.5 v 20 m 30 -20 v 20 m -25 -5 h 20 m -20 30 h 20" stroke="#888" stroke-width="1.5" stroke-dasharray="1, 1.5"/>
  <circle cx="43" cy="56.5" r="1" fill="#333" />
  <text x="54" y="66.5" text-anchor="middle" font-size="4.5" fill="#aaa">MFRC522</text>
  <text x="54" y="73.5" text-anchor="middle" font-size="3.5" fill="#888">NXP</text>
  <text x="54" y="50.5" text-anchor="middle" font-size="4.5" fill="#ffffff">U1</text>

  <!-- Crystal Oscillator -->
  <rect x="45" y="29.5" width="18" height="8" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1" />
  <text x="54" y="35" text-anchor="middle" font-size="3.5" fill="#475569">27.120</text>
  <rect x="49" y="37.5" width="1.5" height="4" fill="#94a3b8" />
  <rect x="57" y="37.5" width="1.5" height="4" fill="#94a3b8" />
  <text x="40" y="34.5" text-anchor="end" font-size="4.5" fill="#ffffff">X1</text>

  <!-- Decorative SMD Components -->
  <rect x="42" y="89.5" width="6" height="3" fill="#111" />
  <rect x="52" y="89.5" width="6" height="3" fill="#111" />
  <rect x="62" y="89.5" width="6" height="3" fill="#111" />
  <text x="45" y="96.5" text-anchor="middle" font-size="3.5" fill="#ffffff">C1</text>
  <text x="55" y="96.5" text-anchor="middle" font-size="3.5" fill="#ffffff">R1</text>
  <text x="65" y="96.5" text-anchor="middle" font-size="3.5" fill="#ffffff">R2</text>
  
  <!-- Status LED -->
  <rect x="60" y="30.5" width="4" height="6" fill="#ef4444" stroke="#7f1d1d" stroke-width="0.5" />
  <circle cx="62" cy="33.5" r="1" fill="#fca5a5" />
  <text x="62" y="27.5" text-anchor="middle" font-size="4" fill="#fff">D1</text>
</svg>
