<svg width="60" height="120" viewBox="0 0 60 120" style="font-family: sans-serif; user-select: none;" xmlns="http://www.w3.org/2000/svg">
  <!-- Blue PCB -->
  <rect x="5" y="5" width="50" height="90" rx="4" fill="#1e5aa8" />

  <!-- Mounting holes -->
  <circle cx="10" cy="10" r="2.5" fill="#fff" />
  <circle cx="50" cy="10" r="2.5" fill="#fff" />
  <circle cx="10" cy="90" r="2.5" fill="#fff" />
  <circle cx="50" cy="90" r="2.5" fill="#fff" />

  <!-- Pad connector (top) -->
  <rect x="22" y="5" width="16" height="6" fill="#111" />
  <rect x="24" y="0" width="2" height="15" fill="#aaa" />
  <rect x="34" y="0" width="2" height="15" fill="#aaa" />

  <!-- LM393 Chip -->
  <rect x="10" y="35" width="12" height="15" rx="1" fill="#222" />
  <!-- Chip pins -->
  <rect x="7" y="37" width="4" height="1" fill="#ccc" />
  <rect x="7" y="40" width="4" height="1" fill="#ccc" />
  <rect x="7" y="43" width="4" height="1" fill="#ccc" />
  <rect x="7" y="46" width="4" height="1" fill="#ccc" />
  <rect x="21" y="37" width="4" height="1" fill="#ccc" />
  <rect x="21" y="40" width="4" height="1" fill="#ccc" />
  <rect x="21" y="43" width="4" height="1" fill="#ccc" />
  <rect x="21" y="46" width="4" height="1" fill="#ccc" />

  <!-- Blue Trimpot -->
  <rect x="28" y="32" width="18" height="20" fill="#3b82f6" stroke="#2563eb" stroke-width="1" />
  <circle cx="37" cy="42" r="6" fill="#facc15" />
  <path d="M 33 42 L 41 42 M 37 38 L 37 46" stroke="#ca8a04" stroke-width="1.5" />

  <!-- Tiny SMD Resistors/Caps -->
  <rect x="12" y="20" width="4" height="6" fill="#111" />
  <rect x="20" y="20" width="4" height="6" fill="#111" />
  <rect x="28" y="20" width="4" height="6" fill="#111" />
  <rect x="36" y="20" width="4" height="6" fill="#111" />

  <!-- LEDs -->
  <!-- PWR -->
  <rect x="42" y="70" width="4" height="6" fill="#fff" />
  <text x="44" y="66" fill="#fff" font-size="4" font-weight="bold" text-anchor="middle">PWR</text>
  <!-- DO -->
  <rect x="14" y="70" width="4" height="6" fill="#fff" />
  <text x="16" y="66" fill="#fff" font-size="4" font-weight="bold" text-anchor="middle">DO</text>

  <!-- Output pins (bottom) -->
  <rect x="14" y="89" width="32" height="6" fill="#111" />
  
  <rect x="16" y="90" width="2" height="20" fill="#d4af37" />
  <rect x="24" y="90" width="2" height="20" fill="#d4af37" />
  <rect x="32" y="90" width="2" height="20" fill="#d4af37" />
  <rect x="40" y="90" width="2" height="20" fill="#d4af37" />

  <text x="17" y="87" fill="#fff" font-size="4" font-weight="bold" text-anchor="middle">AO</text>
  <text x="25" y="87" fill="#fff" font-size="4" font-weight="bold" text-anchor="middle">DO</text>
  <text x="33" y="87" fill="#fff" font-size="4" font-weight="bold" text-anchor="middle">GND</text>
  <text x="41" y="87" fill="#fff" font-size="4" font-weight="bold" text-anchor="middle">VCC</text>
</svg>
