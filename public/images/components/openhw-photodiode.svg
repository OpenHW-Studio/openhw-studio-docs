<svg width="15" height="45" viewBox="-5 -5 25 65" xmlns="http://www.w3.org/2000/svg" style="overflow: visible;">
  <defs>
      <linearGradient id="legMetal" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#9CA3AF" />
          <stop offset="50%" stop-color="#F3F4F6" />
          <stop offset="100%" stop-color="#6B7280" />
      </linearGradient>

      <linearGradient id="pdBody" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="rgba(20, 20, 20, 0.85)" />
          <stop offset="30%" stop-color="rgba(60, 60, 60, 0.9)" />
          <stop offset="70%" stop-color="rgba(20, 20, 20, 0.85)" />
          <stop offset="100%" stop-color="rgba(5, 5, 5, 0.9)" />
      </linearGradient>
      
      <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="rgba(255,255,255,0)" />
          <stop offset="20%" stop-color="rgba(255,255,255,0.4)" />
          <stop offset="35%" stop-color="rgba(255,255,255,0)" />
      </linearGradient>

      <filter id="glow">
          <feGaussianBlur stdDeviation="1" />
      </filter>
  </defs>

  <!-- Anode Leg (Left) -->
  <path d="M 5.5 13 L 5.5 25 Q 5.5 35 0 45" fill="none" stroke="url(#legMetal)" stroke-width="1.2" stroke-linecap="round" />
  <!-- Cathode Leg (Right) -->
  <path d="M 9.5 13 L 9.5 25 Q 9.5 35 15 45" fill="none" stroke="url(#legMetal)" stroke-width="1.2" stroke-linecap="round" />

  <!-- Internal Lead Frame -->
  <!-- Anode Post -->
  <rect x="5" y="8" width="1" height="6" fill="url(#legMetal)" />
  <polygon points="5,8 6,8 5.5,5" fill="url(#legMetal)" />
  <!-- Cathode Anvil -->
  <rect x="8.5" y="6" width="2" height="8" fill="url(#legMetal)" />
  <polygon points="8.5,6 10.5,6 10,4 7.5,4 7.5,5 8.5,6" fill="url(#legMetal)" />
  
  <!-- Silicon Die -->
  <rect x="8" y="3.5" width="1.5" height="1.5" fill="#000" />
  
  <!-- Golden Wire bond -->
  <path d="M 5.5 5 Q 6.5 2.5 8.5 4" fill="none" stroke="#F5B041" stroke-width="0.25" />

  <!-- Main plastic body (Dark tinted) -->
  <path d="M 3 5 C 3 -1.5, 12 -1.5, 12 5 L 12 13 L 3 13 Z" fill="url(#pdBody)" />
  <path d="M 3 5 C 3 -1.5, 12 -1.5, 12 5 L 12 13 L 3 13 Z" fill="url(#highlight)" />
  
  <!-- Base Flange -->
  <rect x="2.5" y="13" width="10" height="2" rx="0.5" fill="url(#pdBody)" />
  <rect x="2.5" y="13" width="10" height="2" rx="0.5" fill="url(#highlight)" />
  
  <!-- Flat spot indicating cathode -->
  <rect x="12" y="13" width="0.5" height="2" fill="rgba(10,10,10,0.9)" />

  <!-- Connection points exactly at y=45 -->
  <circle cx="0" cy="45" r="1.5" fill="#333" />
  <circle cx="15" cy="45" r="1.5" fill="#333" />

  <!-- Labels floating slightly below -->
  <text x="0" y="52" font-size="4" fill="#555" font-family="sans-serif" text-anchor="middle" font-weight="bold">A</text>
  <text x="15" y="52" font-size="4" fill="#555" font-family="sans-serif" text-anchor="middle" font-weight="bold">C</text>
</svg>
