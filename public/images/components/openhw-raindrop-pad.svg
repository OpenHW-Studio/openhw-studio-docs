<svg width="150" height="100" viewBox="0 0 150 100" style="font-family: sans-serif; user-select: none;" xmlns="http://www.w3.org/2000/svg">
  <!-- PCB Base (Dark Grey) -->
  <rect x="5" y="5" width="140" height="90" rx="4" fill="#2d3748" />

  <!-- Silver Mounting Holes -->
  <circle cx="15" cy="15" r="4.5" fill="#94a3b8" />
  <circle cx="15" cy="15" r="2.5" fill="#fff" />
  
  <circle cx="15" cy="85" r="4.5" fill="#94a3b8" />
  <circle cx="15" cy="85" r="2.5" fill="#fff" />
  
  <circle cx="135" cy="15" r="4.5" fill="#94a3b8" />
  <circle cx="135" cy="15" r="2.5" fill="#fff" />
  
  <circle cx="135" cy="85" r="4.5" fill="#94a3b8" />
  <circle cx="135" cy="85" r="2.5" fill="#fff" />

  <!-- Gold/Copper Traces -->
  <path d="M 25 15 L 115 15 L 115 20 L 25 20 Z" fill="#d97706" />
  <path d="M 25 85 L 115 85 L 115 80 L 25 80 Z" fill="#d97706" />
  
  <!-- Interlaced Fingers -->
  <path d="
    M 30 20 L 30 75 L 35 75 L 35 20 Z
    M 40 20 L 40 75 L 45 75 L 45 20 Z
    M 50 20 L 50 75 L 55 75 L 55 20 Z
    M 60 20 L 60 75 L 65 75 L 65 20 Z
    M 70 20 L 70 75 L 75 75 L 75 20 Z
    M 80 20 L 80 75 L 85 75 L 85 20 Z
    M 90 20 L 90 75 L 95 75 L 95 20 Z
    M 100 20 L 100 75 L 105 75 L 105 20 Z
    M 110 20 L 110 75 L 115 75 L 115 20 Z
  " fill="#d97706" />

  <path d="
    M 25 80 L 25 25 L 30 25 L 30 80 Z
    M 35 80 L 35 25 L 40 25 L 40 80 Z
    M 45 80 L 45 25 L 50 25 L 50 80 Z
    M 55 80 L 55 25 L 60 25 L 60 80 Z
    M 65 80 L 65 25 L 70 25 L 70 80 Z
    M 75 80 L 75 25 L 80 25 L 80 80 Z
    M 85 80 L 85 25 L 90 25 L 90 80 Z
    M 95 80 L 95 25 L 100 25 L 100 80 Z
    M 105 80 L 105 25 L 110 25 L 110 80 Z
  " fill="#d97706" />

  <!-- Labels -->
  <g fill="#fff" font-size="8" transform="rotate(90, 15, 50)" text-anchor="middle">
    <text x="15" y="50">Raindrops module</text>
  </g>
  <g fill="#fff" font-size="8" transform="rotate(90, 135, 50)" text-anchor="middle">
    <text x="135" y="25">MH-RD</text>
  </g>
  <g fill="#fff" font-size="8" transform="rotate(90, 135, 30)" text-anchor="middle">
    <text x="135" y="55">DSK</text>
  </g>

  <!-- Output Pins (Right edge) -->
  <!-- Top Pin -->
  <rect x="125" y="44" width="20" height="2" fill="#d4af37" />
  <rect x="123" y="42" width="6" height="6" fill="#111" />
  <circle cx="126" cy="45" r="1.5" fill="#eab308" />
  <!-- Bottom Pin -->
  <rect x="125" y="54" width="20" height="2" fill="#d4af37" />
  <rect x="123" y="52" width="6" height="6" fill="#111" />
  <circle cx="126" cy="55" r="1.5" fill="#eab308" />

  <!-- Pin Traces -->
  <path d="M 115 15 L 120 15 L 120 45 L 125 45" fill="none" stroke="#d97706" stroke-width="2" />
  <path d="M 115 85 L 120 85 L 120 55 L 125 55" fill="none" stroke="#d97706" stroke-width="2" />

</svg>
