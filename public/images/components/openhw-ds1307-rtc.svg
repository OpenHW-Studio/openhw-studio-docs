<svg viewBox="0 0 120 120" width="120" height="120" style="font-family: sans-serif" xmlns="http://www.w3.org/2000/svg">
    <!-- PCB Base - Centered, 15px margins -->
    <rect x="10" y="0" width="100" height="120" rx="3" fill="#184a8c" />
    <rect x="10" y="0" width="100" height="120" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="0.75" />

    <!-- Mounting Holes -->
    <circle cx="21" cy="7.5" r="2.6" fill="#0f172a" stroke="#d1d5db" stroke-width="0.75"/>
    <circle cx="99" cy="112.5" r="2.6" fill="#0f172a" stroke="#d1d5db" stroke-width="0.75"/>
    <circle cx="21" cy="112.5" r="2.6" fill="#0f172a" stroke="#d1d5db" stroke-width="0.75"/>

    <!-- Top Title -->
    <text x="60" y="12" text-anchor="middle" font-size="7.5" fill="#ffffff" font-weight="bold">Tiny RTC I2C</text>

    <!-- Left Pins (Gold) & Holes (15px pitch) -->
    <circle cx="15.0" cy="30" r="1.875" fill="#0f172a" stroke="#fbbf24" stroke-width="0.6" />
    <circle cx="15.0" cy="45" r="1.875" fill="#0f172a" stroke="#fbbf24" stroke-width="0.6" />
    <circle cx="15.0" cy="60" r="1.875" fill="#0f172a" stroke="#fbbf24" stroke-width="0.6" />
    <circle cx="15.0" cy="75" r="1.875" fill="#0f172a" stroke="#fbbf24" stroke-width="0.6" />
    <circle cx="15.0" cy="90" r="1.875" fill="#0f172a" stroke="#fbbf24" stroke-width="0.6" />

    <!-- Left Silkscreen -->
    <text x="21" y="32" text-anchor="start" font-size="4.875" fill="#ffffff" font-weight="bold">DS</text>
    <text x="21" y="47" text-anchor="start" font-size="4.875" fill="#ffffff" font-weight="bold">SCL</text>
    <text x="21" y="62" text-anchor="start" font-size="4.875" fill="#ffffff" font-weight="bold">SDA</text>
    <text x="21" y="77" text-anchor="start" font-size="4.875" fill="#ffffff" font-weight="bold">VCC</text>
    <text x="21" y="92" text-anchor="start" font-size="4.875" fill="#ffffff" font-weight="bold">GND</text>

    <!-- Right Pins (Gold) & Holes (15px pitch) -->
    <circle cx="105.0" cy="15" r="1.875" fill="#0f172a" stroke="#fbbf24" stroke-width="0.6" />
    <circle cx="105.0" cy="30" r="1.875" fill="#0f172a" stroke="#fbbf24" stroke-width="0.6" />
    <circle cx="105.0" cy="45" r="1.875" fill="#0f172a" stroke="#fbbf24" stroke-width="0.6" />
    <circle cx="105.0" cy="60" r="1.875" fill="#0f172a" stroke="#fbbf24" stroke-width="0.6" />
    <circle cx="105.0" cy="75" r="1.875" fill="#0f172a" stroke="#fbbf24" stroke-width="0.6" />
    <circle cx="105.0" cy="90" r="1.875" fill="#0f172a" stroke="#fbbf24" stroke-width="0.6" />
    <circle cx="105.0" cy="105" r="1.875" fill="#0f172a" stroke="#fbbf24" stroke-width="0.6" />

    <!-- Right Silkscreen -->
    <text x="99" y="17" text-anchor="end" font-size="4.875" fill="#ffffff" font-weight="bold">SQ</text>
    <text x="99" y="32" text-anchor="end" font-size="4.875" fill="#ffffff" font-weight="bold">DS</text>
    <text x="99" y="47" text-anchor="end" font-size="4.875" fill="#ffffff" font-weight="bold">SCL</text>
    <text x="99" y="62" text-anchor="end" font-size="4.875" fill="#ffffff" font-weight="bold">SDA</text>
    <text x="99" y="77" text-anchor="end" font-size="4.875" fill="#ffffff" font-weight="bold">VCC</text>
    <text x="99" y="92" text-anchor="end" font-size="4.875" fill="#ffffff" font-weight="bold">GND</text>
    <text x="99" y="107" text-anchor="end" font-size="4.875" fill="#ffffff" font-weight="bold">BAT</text>

    <!-- Crystal (X1) -->
    <rect x="40.5" y="18.75" width="10.5" height="25.5" rx="5.25" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.1" />
    <path d="M 43.5 44.25 L 43.5 51 M 48 44.25 L 48 51" stroke="#94a3b8" stroke-width="1.5" />
    <text x="38.25" y="28.5" text-anchor="end" font-size="4" fill="#ffffff">X1</text>

    <!-- Diode D1 -->
    <rect x="63.75" y="19.5" width="13.5" height="5.25" fill="#ef4444" stroke="#7f1d1d" stroke-width="0.4"/>
    <rect x="74.25" y="19.5" width="3" height="5.25" fill="#111" />
    <text x="61.5" y="22.5" text-anchor="end" font-size="4" fill="#ffffff">D1</text>
    
    <!-- SMD Components -->
    <g fill="#111" stroke="#333" stroke-width="0.4">
        <rect x="63.75" y="31.5" width="7.5" height="3.75" rx="0.75"/>
        <rect x="63.75" y="39" width="7.5" height="3.75" rx="0.75"/>
        <rect x="63.75" y="46.5" width="7.5" height="3.75" rx="0.75"/>
        <rect x="56.25" y="31.5" width="3.75" height="7.5" rx="0.75"/>
        <rect x="56.25" y="42.75" width="3.75" height="7.5" rx="0.75"/>
    </g>

    <!-- U1: Chip -->
    <rect x="33" y="61.5" width="15" height="12" rx="0.75" fill="#1e1e1e" />
    <text x="40.5" y="69" text-anchor="middle" font-size="3.3" fill="#888">DS1307</text>
    <text x="31.5" y="69" text-anchor="end" font-size="3.75" fill="#ffffff">U1</text>

    <!-- U2: Chip -->
    <rect x="72" y="61.5" width="15" height="12" rx="0.75" fill="#1e1e1e" />
    <text x="79.5" y="69" text-anchor="middle" font-size="3.3" fill="#888">24C32</text>
    <text x="88.5" y="69" text-anchor="start" font-size="3.75" fill="#ffffff">U2</text>

    <!-- Digital Screen -->
    <rect x="41.25" y="91.5" width="37.5" height="12" rx="1.1" fill="#0a0a0a" stroke="#111" stroke-width="0.75" />
    <text x="60" y="97.5" text-anchor="middle" font-size="4.5" fill="#2ecc71" font-family="monospace" font-weight="bold">
        00:00:00
    </text>
    <text x="60" y="102" text-anchor="middle" font-size="3.3" fill="#68d391" font-family="monospace">
        2024-01-01
    </text>
</svg>
