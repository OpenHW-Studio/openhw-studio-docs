<svg width="94.5" height="135" viewBox="0 0 94.5 135" xmlns="http://www.w3.org/2000/svg" style="font-family: sans-serif;">
    <!-- PCB Board - Deep Navy Blue -->
    <rect x="0" y="0" width="94.5" height="135" rx="4" fill="#0b2265" />
    <rect x="0" y="0" width="94.5" height="135" rx="4" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="0.75" />

    <!-- Gold Traces / Ground Planes (Subtle details) -->
    <path d="M 12 12 h 70.5 v 111 h -70.5 z" fill="none" stroke="#d4af37" stroke-width="0.5" stroke-opacity="0.2" />

    <!-- Mounting Holes (Top-Right and Bottom-Right) -->
    <circle cx="82.5" cy="15" r="4.5" fill="#1e293b" stroke="#e2e8f0" stroke-width="0.75"/>
    <circle cx="82.5" cy="120" r="4.5" fill="#1e293b" stroke="#e2e8f0" stroke-width="0.75"/>

    <!-- Left Through-Hole Pads (15px pitch) with Gold Ring Plating -->
    <g>
        <circle cx="6" cy="15" r="3" fill="#1a1a1a" stroke="#d4af37" stroke-width="1.2" />
        <circle cx="6" cy="15" r="1.2" fill="#ffffff" fill-opacity="0.2" />
        <circle cx="6" cy="30" r="3" fill="#1a1a1a" stroke="#d4af37" stroke-width="1.2" />
        <circle cx="6" cy="30" r="1.2" fill="#ffffff" fill-opacity="0.2" />
        <circle cx="6" cy="45" r="3" fill="#1a1a1a" stroke="#d4af37" stroke-width="1.2" />
        <circle cx="6" cy="45" r="1.2" fill="#ffffff" fill-opacity="0.2" />
        <circle cx="6" cy="60" r="3" fill="#1a1a1a" stroke="#d4af37" stroke-width="1.2" />
        <circle cx="6" cy="60" r="1.2" fill="#ffffff" fill-opacity="0.2" />
        <circle cx="6" cy="75" r="3" fill="#1a1a1a" stroke="#d4af37" stroke-width="1.2" />
        <circle cx="6" cy="75" r="1.2" fill="#ffffff" fill-opacity="0.2" />
        <circle cx="6" cy="90" r="3" fill="#1a1a1a" stroke="#d4af37" stroke-width="1.2" />
        <circle cx="6" cy="90" r="1.2" fill="#ffffff" fill-opacity="0.2" />
        <circle cx="6" cy="105" r="3" fill="#1a1a1a" stroke="#d4af37" stroke-width="1.2" />
        <circle cx="6" cy="105" r="1.2" fill="#ffffff" fill-opacity="0.2" />
        <circle cx="6" cy="120" r="3" fill="#1a1a1a" stroke="#d4af37" stroke-width="1.2" />
        <circle cx="6" cy="120" r="1.2" fill="#ffffff" fill-opacity="0.2" />
    </g>

    <!-- Left Silkscreen Pin Labels -->
    <g fill="#ffffff" font-size="5.5" font-weight="bold" text-anchor="start" opacity="0.9">
        <text x="13.5" y="17">GND</text>
        <text x="13.5" y="32">VCC</text>
        <text x="13.5" y="47">CS</text>
        <text x="13.5" y="62">INT1</text>
        <text x="13.5" y="77">INT2</text>
        <text x="13.5" y="92">SDO</text>
        <text x="13.5" y="107">SDA</text>
        <text x="13.5" y="122">SCL</text>
    </g>

    <!-- XYZ Axis Indicator -->
    <g stroke="#ffffff" stroke-width="0.75" fill="none" opacity="0.8">
        <!-- X-Axis: Downwards -->
        <path d="M 60 102 L 60 114 m -2 -2 l 2 2 l 2 -2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="60" y="120" fill="#ffffff" font-size="4.5" stroke="none" font-weight="bold" text-anchor="middle">X</text>
        
        <!-- Y-Axis: Rightwards -->
        <path d="M 60 102 L 72 102 m -2 -2 l 2 2 l -2 2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="76" y="103.5" fill="#ffffff" font-size="4.5" stroke="none" font-weight="bold" text-anchor="start">Y</text>
        
        <!-- Z-Axis: Out of Page (Circle with dot) -->
        <circle cx="60" cy="102" r="2.25" />
        <circle cx="60" cy="102" r="0.5" fill="#ffffff" stroke="none" />
        <text x="54" y="103.5" fill="#ffffff" font-size="4.5" stroke="none" font-weight="bold" text-anchor="end">Z</text>
    </g>

    <!-- ADXL345 Chip (PHIL 6838 345B) -->
    <g transform="translate(46, 52.5)">
        <rect x="0" y="0" width="21" height="21" rx="1.5" fill="#1f2937" />
        <!-- Directional pin-1 dot -->
        <circle cx="2.5" cy="2.5" r="0.75" fill="#4b5563" />
        <!-- Silkscreen text on the chip -->
        <text x="10.5" y="6" text-anchor="middle" font-size="2.8" fill="#d1d5db" font-family="monospace">PHIL</text>
        <text x="10.5" y="10.5" text-anchor="middle" font-size="2.8" fill="#d1d5db" font-family="monospace">6838</text>
        <text x="10.5" y="15" text-anchor="middle" font-size="2.8" fill="#d1d5db" font-family="monospace">345B</text>
    </g>

    <!-- Passive Surface-Mount Components (Resistors & Capacitors) -->
    <!-- Voltage regulator (3 pins) -->
    <rect x="36" y="22.5" width="4.5" height="7.5" fill="#1a1a1a" />
    <rect x="34.5" y="23.25" width="1.5" height="0.75" fill="#9ca3af" />
    <rect x="34.5" y="25.5" width="1.5" height="0.75" fill="#9ca3af" />
    <rect x="34.5" y="27.75" width="1.5" height="0.75" fill="#9ca3af" />
    <rect x="40.5" y="25.5" width="1.5" height="1.5" fill="#9ca3af" />

    <!-- Resistor arrays/decoupling caps -->
    <rect x="52.5" y="18" width="6" height="3" fill="#b45309" /> <!-- Tan Tantalum Cap -->
    <rect x="52.5" y="18" width="1.5" height="3" fill="#9ca3af" />
    <rect x="57" y="18" width="1.5" height="3" fill="#9ca3af" />

    <rect x="48" y="27" width="4.5" height="2.25" fill="#27272a" /> <!-- Zero ohm resistor -->
    <text x="50.25" y="29.25" font-size="1.8" fill="#71717a" text-anchor="middle">103</text>

    <rect x="55" y="27" width="4.5" height="2.25" fill="#27272a" />
    <text x="57.25" y="29.25" font-size="1.8" fill="#71717a" text-anchor="middle">103</text>

    <!-- Telemetry Display HUD -->
    <rect x="34.5" y="78" width="42" height="18" rx="1.5" fill="#090d16" stroke="#1e293b" stroke-width="0.5" />
    <circle cx="72" cy="82" r="1" fill="#ef4444" />
    
    <g font-size="3.5" font-family="monospace" fill="#06b6d4">
        <text x="36.5" y="83.5">X: 0.00g</text>
        <text x="36.5" y="88.5">Y: 0.00g</text>
        <text x="36.5" y="93.5">Z: 1.00g</text>
    </g>
</svg>
